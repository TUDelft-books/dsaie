<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore a variational autoencoder</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="vae-mnist-inference.js"></script>
  <style>
    :root { --blue:#0076c2; --orange:#ec6842; --purple:#6f1d77; --panel:#eaeaf2; --axis:#7f8794; --border:#dde3ea; --muted:#5f6b7a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#1b1f24; background:#fff; }
    .shell { padding:12px; }
    .card { border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px #0c23400f; }
    h2 { margin:0; font-size:1rem; font-weight:600; }
    .controls { padding:14px; background:#f7f9fb; border-bottom:1px solid #edf1f5; }
    .buttons { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    button { font:inherit; border:1px solid #cfd7e3; background:#fff; color:#243140; border-radius:999px; padding:7px 12px; cursor:pointer; font-size:.85rem; }
    button:hover:not(:disabled) { background:#eef5fb; border-color:#7cb3df; }
    button:disabled { opacity:.45; cursor:default; }
    button:focus-visible,svg:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    #play { background:var(--blue); color:white; border-color:var(--blue); }
    .timeline { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; margin-top:12px; font-size:.82rem; }
    input { min-width:0; width:100%; accent-color:var(--blue); }
    .pipeline { display:grid; grid-template-columns:112px 96px minmax(200px,1fr) 96px 112px; grid-template-areas:"source encoder latent decoder result"; align-items:center; gap:6px; padding:14px 12px; }
    .source { grid-area:source; } .encoder { grid-area:encoder; } .latent { grid-area:latent; min-width:0; width:100%; max-width:340px; justify-self:center; }
    .decoder { grid-area:decoder; } .result { grid-area:result; }
    .image-panel { text-align:center; min-width:0; }
    .image-panel h3 { font-size:.8rem; font-weight:600; margin:0 0 10px; }
    canvas { display:block; width:112px; max-width:100%; height:auto; aspect-ratio:1; margin:auto; background:#111; border-radius:6px; image-rendering:pixelated; }
    .image-panel p { font-size:.73rem; color:var(--muted); margin:8px 0 0; line-height:1.4; }
    .network { text-align:center; min-width:0; }
    .network::before { content:""; display:block; height:.96rem; margin-bottom:10px; }
    .network svg { width:96px; height:112px; max-width:100%; display:block; margin:auto; }
    .network span { display:block; font-size:.73rem; color:var(--muted); margin-top:8px; line-height:1.4; }
    .exploring .source,.exploring .encoder { opacity:.4; }
    #latent { display:block; width:100%; height:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); touch-action:none; cursor:crosshair; }
    .axis path,.axis line { stroke:var(--axis); }
    .axis text,.axis-label { fill:#44505d; font-family:inherit; font-size:12px; }
    .grid line { stroke:white; } .grid path { display:none; }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 12px; font-size:.73rem; color:var(--muted); margin:8px 0 0; }
    .legend i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; }
    #coordinates { font-variant-numeric:tabular-nums; color:#243140; text-align:center; font-size:.8rem; margin:8px 0 0; }
    .footer { border-top:1px solid #edf1f5; padding:10px 14px; background:#f7f9fb; }
    #status { font-size:.83rem; line-height:1.5; margin:0; }
    @media(max-width:700px) {
      .shell { padding:8px; }
      .pipeline { grid-template-columns:1fr 1fr; grid-template-areas:"source encoder" "latent latent" "decoder result"; gap:12px; padding:12px; }
      .network svg { width:77.14px; height:90px; }
      .network::before { margin-bottom:7px; }
      .latent { width:100%; max-width:380px; margin:auto; }
      canvas { width:90px; }
      .network span { display:block; }
      .image-panel h3 { margin-bottom:7px; }
      .controls { padding:12px; }
      h2 { font-size:.94rem; }
      .timeline { gap:7px; }
    }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
  </style>
</head>
<body>
<div class="shell"><div class="card">
  <div class="controls">
    <h2>Explore a two-dimensional VAE</h2>
    <div class="buttons">
      <button id="play" type="button" disabled>Start training replay</button>
      <button id="generate" type="button" disabled>Generate</button>
      <button id="next" type="button" disabled>Next input</button>
    </div>
    <label class="timeline" for="epoch"><span>Training stage</span><input id="epoch" type="range" min="0" max="24" value="0" step="1" disabled><output id="epoch-value">Loading…</output></label>
  </div>
  <div id="pipeline" class="pipeline">
    <div class="source image-panel">
      <h3>Original input</h3>
      <canvas id="original" width="28" height="28" role="img" aria-label="Original MNIST image"></canvas>
      <p id="input-label">Held-out digit</p>
    </div>
    <div class="encoder network">
      <svg viewBox="0 0 96 112" role="img" aria-label="Encoder maps the image to a latent distribution">
        <path d="M4 1L74 32V80L4 111Z" fill="#0076c21a" stroke="#0076c2" stroke-width="2"/>
        <path d="M77 56H95M88 50L95 56L88 62" fill="none" stroke="#7f8794" stroke-width="2"/>
        <text x="39" y="52" text-anchor="middle" fill="#0076c2" font-size="11" font-family="system-ui">Encoder</text>
        <text x="39" y="69" text-anchor="middle" fill="#44505d" font-size="10" font-family="serif">p(z | x)</text>
      </svg>
      <span>784 → 2</span>
    </div>
    <div class="latent">
      <svg id="latent" viewBox="0 0 360 340" tabindex="0" role="application" aria-label="Two-dimensional latent space. Drag to decode a location, or use arrow keys. Shift and arrow keys move farther.">
        <title>Latent space z₁, z₂</title>
        <desc>Colored dots are held-out images encoded by the selected model. The outlined point can be dragged to generate a new image. The selected input starts at its encoder mean.</desc>
      </svg>
      <p id="coordinates">z₁ = 0.00 · z₂ = 0.00</p>
      <div class="legend"><span><i style="background:#0076c2"></i>0</span><span><i style="background:#6f1d77"></i>1</span><span><i style="background:#ec6842"></i>8</span><span>Encoded inputs</span></div>
    </div>
    <div class="decoder network">
      <svg viewBox="0 0 96 112" role="img" aria-label="Decoder maps the selected latent point to a 28 by 28 image">
        <path d="M1 56H19M12 50L19 56L12 62" fill="none" stroke="#7f8794" stroke-width="2"/>
        <path d="M22 32L92 1V111L22 80Z" fill="#ec68421a" stroke="#ec6842" stroke-width="2"/>
        <text x="57" y="52" text-anchor="middle" fill="#b74d2d" font-size="11" font-family="system-ui">Decoder</text>
        <text x="57" y="69" text-anchor="middle" fill="#44505d" font-size="10" font-family="serif">p(x | z)</text>
      </svg>
      <span>2 → 784</span>
    </div>
    <div class="result image-panel">
      <h3 id="result-title">Reconstruction</h3>
      <canvas id="decoded" width="28" height="28" role="img" aria-label="VAE decoder output"></canvas>
      <p>28 × 28 pixels</p>
    </div>
  </div>
  <div class="footer">
    <p id="status" role="status" aria-live="polite">Loading the saved training run…</p>
  </div>
</div></div>
<script>
(() => {
  'use strict';
  // The book and widget share an origin; resize for narrow layouts and changing status text.
  let hostFrame=null;
  try{hostFrame=window.frameElement;}catch{}
  if(hostFrame&&window.ResizeObserver){
    new ResizeObserver(()=>{
      hostFrame.style.height=`${Math.ceil(document.querySelector('.shell').getBoundingClientRect().height)+2}px`;
    }).observe(document.querySelector('.shell'));
  }
  const controls=['play','generate','next','epoch'].map(id=>document.getElementById(id));
  const status=document.getElementById('status'),stage=document.getElementById('epoch');
  let model,buffer,images,network,index=0,example=0,z=[0,0],playing=false,timer=null,frame=null,dragging=null;
  const canvas=document.getElementById('decoded'),context=canvas.getContext('2d'),raster=context.createImageData(28,28);
  const original=document.getElementById('original'),originalContext=original.getContext('2d');
  const originalRaster=originalContext.createImageData(28,28);
  let svg,x,y,cloud,point,xAxis,yAxis,grid,rings;
  const colors={0:'#0076c2',1:'#6f1d77',8:'#ec6842'};
  function paint(ctx,image,pixels,scale){
    for(let i=0;i<784;i++){
      const v=Math.max(0,Math.min(255,Math.round(pixels[i]*scale))),p=4*i;
      image.data[p]=v;image.data[p+1]=v;image.data[p+2]=v;image.data[p+3]=255;
    }
    ctx.putImageData(image,0,0);
  }
  function render(){
    frame=null;
    paint(context,raster,MnistVae.decode(network,z),255);
    point.attr('cx',x(z[0])).attr('cy',y(z[1]));
    document.getElementById('coordinates').textContent=`z₁ = ${z[0].toFixed(2)} · z₂ = ${z[1].toFixed(2)}`;
  }
  function queueRender(){if(frame===null)frame=requestAnimationFrame(render);}
  function pause(){
    playing=false;if(timer!==null){clearTimeout(timer);timer=null;}
    document.getElementById('play').textContent=index===model.checkpoints.length-1?'Replay training':index===0?'Start training replay':'Resume training replay';
  }
  function showExample(){
    const checkpoint=model.checkpoints[index];
    z=[...checkpoint.mu[example]];
    paint(originalContext,originalRaster,images.subarray(example*784,(example+1)*784),1);
    document.getElementById('input-label').textContent=`Held-out digit ${model.labels[example]}`;
    original.setAttribute('aria-label',`Original held-out MNIST digit ${model.labels[example]}`);
    document.getElementById('pipeline').classList.remove('exploring');
    document.getElementById('result-title').textContent='Reconstruction';
    queueRender();
  }
  function fitLatent(extra=[]){
    const state=model.checkpoints[index];
    // Keep early encoder means and even rare, untruncated prior draws visible.
    const maximum=Math.max(d3.max(state.mu,row=>Math.max(...row.map(Math.abs))),...extra.map(Math.abs));
    const extent=Math.max(3,Math.ceil(maximum*1.01*2)/2);
    x.domain([-extent,extent]);y.domain([-extent,extent]);
    xAxis.call(d3.axisBottom(x).ticks(6));yAxis.call(d3.axisLeft(y).ticks(6));
    grid.call(d3.axisLeft(y).ticks(6).tickSize(-300).tickFormat(''));
    rings.attr('rx',d=>x(d)-x(0)).attr('ry',d=>y(0)-y(d));
    cloud.data(state.mu).attr('cx',d=>x(d[0])).attr('cy',d=>y(d[1]));
  }
  function checkpoint(next){
    index=next;const state=model.checkpoints[index];
    network=MnistVae.unpack(buffer,index,model);fitLatent();
    stage.value=index;document.getElementById('epoch-value').textContent=`Epoch ${state.epoch} / ${model.training.epochs}`;
    example=(index*7)%model.labels.length;showExample();
  }
  function explain(){
    status.textContent=index===0?'Untrained: random weights give meaningless images. Start the replay, or move the training-stage slider.':'Drag the point or click the latent space to generate an image. Arrow keys also move the point.';
  }
  function advance(){
    if(!playing)return;
    if(index===model.checkpoints.length-1){pause();status.textContent='Training replay complete. Drag the latent point to explore the trained decoder.';return;}
    checkpoint(index+1);
    status.textContent=`Training replay · epoch ${model.checkpoints[index].epoch}. Pause at any time to explore this model.`;
    timer=setTimeout(advance,650);
  }
  function explore(location){
    pause();z=location;
    document.getElementById('pipeline').classList.add('exploring');
    document.getElementById('result-title').textContent='Generated image';
    status.textContent='Exploring the latent space. The decoder generates an image from your selected z.';
    queueRender();
  }
  function pointerLocation(event){
    const location=d3.pointer(event,svg.node());
    return [Math.max(x.domain()[0],Math.min(x.domain()[1],x.invert(location[0]))),Math.max(y.domain()[0],Math.min(y.domain()[1],y.invert(location[1])))];
  }
  async function start(){
    if(!window.d3||!window.MnistVae)throw Error('The plotting or decoder script did not load.');
    const responses=await Promise.all([fetch('vae-mnist/model.json'),fetch('vae-mnist/decoders.bin')]);
    if(responses.some(r=>!r.ok))throw Error('The saved model could not be downloaded.');
    [model,buffer]=await Promise.all([responses[0].json(),responses[1].arrayBuffer()]);
    if(model.version!==1||model.hidden!==64||model.weightCount!==51152||buffer.byteLength!==model.checkpoints.length*model.weightCount*2)throw Error('The model assets are incompatible or incomplete.');
    images=Uint8Array.from(atob(model.images),c=>c.charCodeAt(0));
    if(images.length!==model.labels.length*784)throw Error('The example images are incomplete.');
    stage.max=model.checkpoints.length-1;
    svg=d3.select('#latent');x=d3.scaleLinear([-3,3],[42,342]);y=d3.scaleLinear([-3,3],[302,18]);
    svg.append('defs').append('clipPath').attr('id','latent-clip').append('rect').attr('x',42).attr('y',18).attr('width',300).attr('height',284);
    grid=svg.append('g').attr('class','grid').attr('transform','translate(42,0)').call(d3.axisLeft(y).ticks(6).tickSize(-300).tickFormat(''));
    xAxis=svg.append('g').attr('class','axis').attr('transform','translate(0,302)').call(d3.axisBottom(x).ticks(6));
    yAxis=svg.append('g').attr('class','axis').attr('transform','translate(42,0)').call(d3.axisLeft(y).ticks(6));
    svg.append('text').attr('class','axis-label').attr('x',192).attr('y',333).attr('text-anchor','middle').text('z₁');
    svg.append('text').attr('class','axis-label').attr('transform','rotate(-90)').attr('x',-160).attr('y',13).attr('text-anchor','middle').text('z₂');
    const marks=svg.append('g').attr('clip-path','url(#latent-clip)');
    rings=marks.append('g').selectAll('ellipse').data([1,2]).join('ellipse').attr('cx',x(0)).attr('cy',y(0)).attr('rx',d=>x(d)-x(0)).attr('ry',d=>y(0)-y(d)).attr('fill','white').attr('fill-opacity',.17).attr('stroke','#a7afba').attr('stroke-dasharray','4 4');
    cloud=marks.append('g').selectAll('circle').data(model.labels).join('circle').attr('r',3).attr('fill',(_,i)=>colors[model.labels[i]]).attr('opacity',.45);
    point=marks.append('circle').attr('class','latent-point').attr('r',7).attr('fill','#ec6842').attr('stroke','white').attr('stroke-width',2.5).style('pointer-events','none');
    checkpoint(0);explain();controls.forEach(c=>c.disabled=false);
    document.getElementById('play').addEventListener('click',()=>{
      if(playing){pause();explain();return;}
      if(index===model.checkpoints.length-1)checkpoint(0);
      playing=true;document.getElementById('play').textContent='Pause training replay';advance();
    });
    document.getElementById('generate').addEventListener('click',()=>{
      const normal=d3.randomNormal(0,1),location=[normal(),normal()];
      fitLatent(location);explore(location);
      status.textContent='Generated from z ∼ N(0, I). Drag the point to explore nearby generations.';
    });
    document.getElementById('next').addEventListener('click',()=>{pause();example=(example+1)%model.labels.length;fitLatent();showExample();explain();});
    stage.addEventListener('input',()=>{pause();checkpoint(Number(stage.value));pause();explain();});
    svg.on('pointerdown',event=>{
      if(event.button!==0)return;
      event.preventDefault();svg.node().focus({preventScroll:true});dragging=event.pointerId;svg.node().setPointerCapture(event.pointerId);explore(pointerLocation(event));
    }).on('pointermove',event=>{if(event.pointerId===dragging)explore(pointerLocation(event));})
      .on('pointerup pointercancel lostpointercapture',()=>{dragging=null;})
      .on('keydown',event=>{
        const direction={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[event.key];
        if(!direction)return;
        event.preventDefault();const step=event.shiftKey ? .25 : .05;
        explore(z.map((v,i)=>Math.max(x.domain()[0],Math.min(x.domain()[1],v+step*direction[i]))));
      });
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){pause();explain();}});
  }
  start().catch(error=>{
    console.error(error);status.textContent=`Unable to load the VAE. ${error.message} Reload this widget to retry.`;
  });
})();
</script>
</body>
</html>
