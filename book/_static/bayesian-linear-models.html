<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLE, MAP and Bayesian polynomial regression</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root { --blue:#0076c2; --orange:#ec6842; --purple:#6f1d77; --black:#111; --panel:#eaeaf2; --axis:#7f8794; --border:#dde3ea; --muted:#5f6b7a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#1b1f24; background:#fff; }
    .shell { width:100%; padding:12px; }
    .card { border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(12,35,64,.06); }
    .controls { display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:center; padding:12px 14px; background:#f7f9fb; border-bottom:1px solid #edf1f5; }
    .math-symbol { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; font-size:1.08em; }
    .control { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:center; min-width:0; color:#243140; font-size:.9rem; }
    .button-stack { display:grid; gap:7px; }
    input[type=range] { width:100%; min-width:0; accent-color:var(--blue); }
    button { border:1px solid #cfd7e3; background:#fff; color:#243140; border-radius:999px; padding:7px 12px; cursor:pointer; font-size:.86rem; white-space:nowrap; }
    button:hover { background:#eef5fb; border-color:#7cb3df; }
    .chart { padding:10px; background:#fff; }
    svg { display:block; width:100%; height:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; }
    .axis path,.axis line { stroke:var(--axis); }
    .axis text,.label,.legend text,.panel-title { font-family:inherit; fill:#44505d; font-size:11px; }
    .grid line { stroke:#fff; stroke-opacity:.95; } .grid path { display:none; }
    .panel-title { font-weight:600; fill:#243140; }
    @media(max-width:760px){ .controls{grid-template-columns:1fr;gap:12px}.shell{padding:8px}.control{grid-template-columns:170px minmax(0,1fr)}.button-stack{grid-template-columns:1fr 1fr} }
  </style>
</head>
<body>
<div class="shell"><div class="card">
  <div class="controls">
    <div class="button-stack"><button id="resample" type="button">Resample</button><button id="add" type="button">Add observations</button></div>
    <label class="control"><span>Trust in prior (<span class="math-symbol">α</span>)</span><input id="alpha" type="range" min="-3" max="5" step="any"></label>
    <label class="control"><span>Trust in observations (<span class="math-symbol">β</span>)</span><input id="beta" type="range" min="-2" max="5" step="any"></label>
  </div>
  <div class="chart"><svg id="viz" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Comparison of MLE, MAP and Bayesian polynomial regression</title><desc id="desc">Prediction plot and five weight-distribution plots controlled by prior and noise precision.</desc></svg></div>
</div></div>
<script>
(() => {
  const d3v=window.d3, svg=d3v.select('#viz');
  const C={truth:'#111111',data:'#0076c2',bayes:'#ec6842',mle:'#6f1d77',prior:'#7f8794',post:'#0076c2'};
  const INITIAL_N=5,M=5; let seed=147, data, alpha, beta;
  function rng(s){ return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296} }
  function normal(r){const u=Math.max(r(),1e-12),v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  const phi=x=>[1,x,x*x,x*x*x,x*x*x*x];
  const truth=x=>Math.sin(1.5*x);
  const transpose=A=>A[0].map((_,j)=>A.map(r=>r[j]));
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const mv=(A,v)=>A.map(r=>r.reduce((s,x,i)=>s+x*v[i],0));
  function inverse(A){const n=A.length,a=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(a[j][i])>Math.abs(a[p][i]))p=j;[a[i],a[p]]=[a[p],a[i]];let q=a[i][i];if(Math.abs(q)<1e-12)q=q<0?-1e-12:1e-12;for(let j=0;j<2*n;j++)a[i][j]/=q;for(let k=0;k<n;k++)if(k!==i){q=a[k][i];for(let j=0;j<2*n;j++)a[k][j]-=q*a[i][j]}}return a.map(r=>r.slice(n))}
  function fit(a,b){const X=data.map(d=>phi(d.x)),Xt=transpose(X),G=mul(Xt,X),rhs=mv(Xt,data.map(d=>d.y));const Sm=inverse(G.map((r,i)=>r.map((v,j)=>b*v+(i===j?a:0))));const map=mv(Sm,rhs.map(v=>b*v));const mle=mv(inverse(G.map((r,i)=>r.map((v,j)=>v+(i===j?1e-9:0)))),rhs);return{S:Sm,map,mle,G}}
  function empirical(){let a=1,b=10;for(let k=0;k<80;k++){const f=fit(a,b),A=f.G.map((r,i)=>r.map((v,j)=>b*v+(i===j?a:0))),eigs=jacobi(A).map(v=>Math.max(0,v-a)),gamma=eigs.reduce((s,l)=>s+l/(a+l),0),err=data.reduce((s,d)=>{const e=d.y-dot(phi(d.x),f.map);return s+e*e},0),norm=dot(f.map,f.map);a=Math.max(.001,Math.min(1e5,gamma/Math.max(norm,1e-9)));b=Math.max(.01,Math.min(1e5,(data.length-gamma)/Math.max(err,1e-9)))}return[a,b]}
  function jacobi(A){A=A.map(r=>r.slice());for(let z=0;z<60;z++){let p=0,q=1;for(let i=0;i<M;i++)for(let j=i+1;j<M;j++)if(Math.abs(A[i][j])>Math.abs(A[p][q])){p=i;q=j}if(Math.abs(A[p][q])<1e-10)break;const t=.5*Math.atan2(2*A[p][q],A[q][q]-A[p][p]),c=Math.cos(t),s=Math.sin(t);for(let k=0;k<M;k++){const x=A[k][p],y=A[k][q];A[k][p]=c*x-s*y;A[k][q]=s*x+c*y}for(let k=0;k<M;k++){const x=A[p][k],y=A[q][k];A[p][k]=c*x-s*y;A[q][k]=s*x+c*y}}return A.map((r,i)=>r[i])}
  const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
  function observation(x,r){return{x,y:truth(x)+normal(r)*.22}}
  function sample(animate=false){const previous={alpha,beta},r=rng(seed++);data=d3v.range(INITIAL_N).map(i=>observation(.25+i*3.5/(INITIAL_N-1)+(r()-.5)*.18,r));[alpha,beta]=empirical();setControls(animate,previous);draw(animate?0:null)}
  function addObservations(){const previous={alpha,beta},firstNew=data.length,r=rng(seed++);data.push(...d3v.range(5).map(()=>observation(4*r(),r)));[alpha,beta]=empirical();setControls(true,previous);draw(firstNew)}
  function setControls(animate=false,previous={}){[['#alpha','alpha',alpha],['#beta','beta',beta]].forEach(([id,key,value])=>{const slider=d3v.select(id).interrupt(),end=Math.log10(value);if(!animate||!Number.isFinite(previous[key]))slider.property('value',end);else{const start=Math.log10(previous[key]),interpolate=d3v.interpolateNumber(start,end);slider.property('value',start).transition().duration(850).ease(d3v.easeCubicInOut).tween('value',function(){return t=>{this.value=interpolate(t)}})}})}
  function axes(g,x,y,w,h,xTicks=5,yTicks=5){g.append('g').attr('class','grid').call(d3v.axisLeft(y).ticks(yTicks).tickSize(-w).tickFormat(''));g.append('g').attr('class','axis').attr('transform',`translate(0,${h})`).call(d3v.axisBottom(x).ticks(xTicks));g.append('g').attr('class','axis').call(d3v.axisLeft(y).ticks(yTicks))}
  function draw(animateFrom=null){svg.selectAll('*:not(title):not(desc)').remove();const f=fit(alpha,beta),left={x:55,y:48,w:555,h:485},right={x:670,y:26,w:300,h:96};
    const xs=d3v.range(241).map(i=>6*i/240), pred=xs.map(x=>{const p=phi(x),mu=dot(p,f.map),v=1/beta+dot(p,mv(f.S,p));return{x,mu,lo:mu-2*Math.sqrt(v),hi:mu+2*Math.sqrt(v),mle:dot(p,f.mle),truth:truth(x)}}),lim=3;const x=d3v.scaleLinear([0,6],[0,left.w]),y=d3v.scaleLinear([-lim,lim],[left.h,0]),g=svg.append('g').attr('transform',`translate(${left.x},${left.y})`),clipId='prediction-clip';g.append('defs').append('clipPath').attr('id',clipId).append('rect').attr('width',left.w).attr('height',left.h);axes(g,x,y,left.w,left.h,6,5);const marks=g.append('g').attr('clip-path',`url(#${clipId})`);marks.append('path').datum(pred).attr('fill',C.bayes).attr('opacity',.18).attr('d',d3v.area().x(d=>x(d.x)).y0(d=>y(d.lo)).y1(d=>y(d.hi)));const line=(key,color,dash,width=2)=>marks.append('path').datum(pred).attr('fill','none').attr('stroke',color).attr('stroke-width',width).attr('stroke-dasharray',dash||null).attr('d',d3v.line().x(d=>x(d.x)).y(d=>y(d[key])));line('truth',C.truth,'4 3',1.5);line('mle',C.mle,'7 4');line('mu',C.bayes);const points=marks.selectAll('circle').data(data).join('circle').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('fill',C.data).attr('stroke','#fff');if(animateFrom===null)points.attr('r',4).attr('opacity',1);else points.attr('r',(d,i)=>i<animateFrom?4:0).attr('opacity',(d,i)=>i<animateFrom?1:0).transition().delay((d,i)=>i<animateFrom?0:(i-animateFrom)*90).duration(450).ease(d3v.easeBackOut).attr('r',4).attr('opacity',1);g.append('text').attr('class','panel-title').attr('x',left.w/2).attr('y',-22).attr('text-anchor','middle').text('Predictions and extrapolation');g.append('text').attr('class','label').attr('x',left.w/2).attr('y',left.h+38).attr('text-anchor','middle').text('x');g.append('text').attr('class','label').attr('transform','rotate(-90)').attr('x',-left.h/2).attr('y',-42).attr('text-anchor','middle').text('t');
    const legend=[['Ground truth',C.truth,'4 3'],['Observations',C.data,null],['MLE',C.mle,'7 4'],['Bayes mean ±2σ',C.bayes,null]];const lg=g.append('g').attr('class','legend').attr('transform','translate(10,12)');legend.forEach((d,i)=>{lg.append('line').attr('x2',24).attr('y1',i*18).attr('y2',i*18).attr('stroke',d[1]).attr('stroke-width',3).attr('stroke-dasharray',d[2]);lg.append('text').attr('x',30).attr('y',i*18+4).text(d[0])});
    for(let i=0;i<M;i++){const gy=right.y+i*(right.h+14),sdP=1/Math.sqrt(alpha),sd=Math.sqrt(Math.max(0,f.S[i][i])),span=Math.max(2.7*sdP,3.3*sd,Math.abs(f.map[i])*1.18,Math.abs(f.mle[i])*1.18,.2),wx=d3v.scaleLinear([-span,span],[0,right.w]),maxD=Math.max(1/(sdP*Math.sqrt(2*Math.PI)),1/(sd*Math.sqrt(2*Math.PI))),wy=d3v.scaleLinear([0,maxD*1.12],[right.h,0]),wg=svg.append('g').attr('transform',`translate(${right.x},${gy})`),pointCount=Math.min(481,181+30*Math.max(0,Math.ceil(Math.log10(beta)))),vals=d3v.range(pointCount).map(k=>-span+2*span*k/(pointCount-1)),gauss=(z,m,s)=>Math.exp(-.5*((z-m)/s)**2)/(s*Math.sqrt(2*Math.PI)),mapDensity=gauss(f.map[i],f.map[i],sd);wg.append('rect').attr('width',right.w).attr('height',right.h).attr('fill','#fff').attr('opacity',.35);wg.append('path').datum(vals).attr('fill','none').attr('stroke',C.prior).attr('stroke-width',1.8).attr('d',d3v.line().x(wx).y(z=>wy(gauss(z,0,sdP))));wg.append('path').datum(vals).attr('fill','none').attr('stroke',C.post).attr('stroke-width',2).attr('d',d3v.line().x(wx).y(z=>wy(gauss(z,f.map[i],sd))));wg.append('line').attr('x1',wx(f.mle[i])).attr('x2',wx(f.mle[i])).attr('y1',5).attr('y2',right.h).attr('stroke',C.mle).attr('stroke-width',1.8).attr('stroke-dasharray','5 3');wg.append('circle').attr('cx',wx(f.map[i])).attr('cy',wy(mapDensity)).attr('r',4.5).attr('fill',C.bayes).attr('stroke','#fff').attr('stroke-width',1.2);wg.append('g').attr('class','axis').attr('transform',`translate(0,${right.h})`).call(d3v.axisBottom(wx).ticks(5));wg.append('text').attr('class','panel-title').attr('x',6).attr('y',14).text(`w${i}`)}
    const rl=svg.append('g').attr('class','legend').attr('transform','translate(682,14)');[['prior',C.prior,'line'],['posterior',C.post,'line'],['MAP',C.bayes,'point'],['MLE',C.mle,'dash']].forEach((d,i)=>{const xx=i*72;if(d[2]==='point')rl.append('circle').attr('cx',xx+8).attr('r',4).attr('fill',d[1]);else rl.append('line').attr('x1',xx).attr('x2',xx+16).attr('stroke',d[1]).attr('stroke-width',2).attr('stroke-dasharray',d[2]==='dash'?'4 3':null);rl.append('text').attr('x',xx+20).attr('y',4).text(d[0])})}
  d3v.select('#alpha').on('input',function(){alpha=10**(+this.value);setControls();draw()});d3v.select('#beta').on('input',function(){beta=10**(+this.value);setControls();draw()});d3v.select('#resample').on('click',()=>sample(true));d3v.select('#add').on('click',addObservations);sample();
})();
</script>
</body></html>
