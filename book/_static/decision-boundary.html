<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive decision boundary</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --class-one: #017188;
      --class-two: #c3312f;
      --error-one: #0066a2;
      --error-two: #00a390;
      --overlap: #99d28c;
      --border: #dde3ea;
      --surface: #ffffff;
      --surface-soft: #f7f9fb;
      --muted: #5f6b7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #1b1f24;
      background: var(--surface);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .widget-shell { width: 100%; padding: 12px; }
    .widget-card {
      width: 100%; overflow: hidden; border: 1px solid var(--border);
      border-radius: 12px; background: var(--surface);
      box-shadow: 0 1px 3px rgba(12, 35, 64, 0.06);
    }
    .instruction {
      margin: 0; padding: 10px 14px; color: #243140; background: var(--surface-soft);
      border-bottom: 1px solid #edf1f5; font-size: 0.9rem;
    }
    .instruction strong { font-weight: 600; }
    .chart-panel { padding: 10px; }
    svg { display: block; width: 100%; height: auto; touch-action: none; }
    text { font-family: inherit; fill: #111; }
    .curve { fill: none; stroke-width: 4; }
    .axis { stroke: #111; stroke-width: 1.75; }
    .boundary { stroke: #111; stroke-width: 1.5; }
    .boundary-hit { cursor: ew-resize; stroke: transparent; stroke-width: 24; }
    .handle { cursor: ew-resize; fill: #fff; stroke: #111; stroke-width: 1.5; }
    .region-label, .matrix-label { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    .matrix-outline { fill: none; stroke: #111; stroke-width: 1; }
    .matrix-divider { stroke: #111; stroke-width: 1; }
    .value-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) {
      .widget-shell { padding: 8px; }
      .instruction { font-size: 0.84rem; }
    }
  </style>
</head>
<body>
  <main class="widget-shell">
    <section class="widget-card" aria-label="Interactive decision boundary and confusion matrix">
      <p class="instruction"><strong>Drag the decision boundary</strong> to compare the classification regions and their confusion-matrix areas.</p>
      <div class="chart-panel"><svg id="chart" role="img" aria-labelledby="chart-title chart-desc"></svg></div>
    </section>
  </main>
<script>
(() => {
  const d3v = window.d3;
  if (!d3v) return;

  const svg = d3v.select("#chart");
  const width = 920;
  const height = 410;
  svg.attr("viewBox", `0 0 ${width} ${height}`).attr("preserveAspectRatio", "xMidYMid meet");
  svg.append("title").attr("id", "chart-title").text("Movable decision boundary");
  svg.append("desc").attr("id", "chart-desc").text("Two class joint-density curves. Drag the vertical boundary; areas in the confusion matrix change to match.");

  const plot = { left: 48, right: 608, top: 54, bottom: 340 };
  const matrix = { left: 690, top: 135, size: 170 };
  const domain = [0, 6];
  const x = d3v.scaleLinear().domain(domain).range([plot.left, plot.right]);
  const y = d3v.scaleLinear().domain([0, 0.5]).range([plot.bottom, plot.top]);
  const normal = (v, mean, sd, weight) => weight * Math.exp(-0.5 * ((v - mean) / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI));
  const density1 = v => normal(v, 2, 0.85, 1);
  const density2 = v => normal(v, 4, 0.85, 1);
  const samples = d3v.range(domain[0], domain[1] + 0.001, 0.01);
  const line = d3v.line().x(d => x(d)).y(d => y(density1(d))).curve(d3v.curveBasis);
  const line2 = d3v.line().x(d => x(d)).y(d => y(density2(d))).curve(d3v.curveBasis);
  const defs = svg.append("defs");
  defs.append("clipPath").attr("id", "plot-clip").append("rect")
    .attr("x", plot.left).attr("y", plot.top).attr("width", plot.right - plot.left).attr("height", plot.bottom - plot.top);
  const g = svg.append("g");

  g.append("line").attr("class", "axis").attr("x1", plot.left).attr("x2", plot.right + 10).attr("y1", plot.bottom).attr("y2", plot.bottom);
  g.append("path").attr("d", `M${plot.right + 10},${plot.bottom}l-9,-5v10z`).attr("fill", "#111");
  g.append("line").attr("class", "axis").attr("x1", plot.left).attr("x2", plot.left).attr("y1", plot.bottom).attr("y2", plot.top - 8);
  g.append("path").attr("d", `M${plot.left},${plot.top - 8}l-5,9h10z`).attr("fill", "#111");
  g.append("text").attr("x", plot.right + 19).attr("y", plot.bottom + 5).attr("font-family", "Georgia, serif").attr("font-style", "italic").text("x");

  const fills = g.append("g").attr("clip-path", "url(#plot-clip)");
  const areaFor = fn => d3v.area().x(d => x(d)).y0(plot.bottom).y1(d => y(fn(d))).curve(d3v.curveBasis);
  const areaBetween = (lower, upper) => d3v.area().x(d => x(d))
    .y0(d => y(lower(d))).y1(d => y(upper(d))).curve(d3v.curveBasis);
  const overlap = v => Math.min(density1(v), density2(v));
  const excess1 = v => Math.max(0, density1(v) - density2(v));
  const excess2 = v => Math.max(0, density2(v) - density1(v));
  const correctArea1 = fills.append("path").attr("fill", "#017188").attr("fill-opacity", 0.2);
  const correctArea2 = fills.append("path").attr("fill", "#c3312f").attr("fill-opacity", 0.2);
  const greenOverlapArea = fills.append("path").attr("fill", "#00a390");
  const greenExcessArea = fills.append("path").attr("fill", "#99d28c");
  const blueOverlapArea = fills.append("path").attr("fill", "#0066a2");
  const blueExcessArea = fills.append("path").attr("fill", "#70b7cb");

  g.append("path").datum(samples).attr("class", "curve").attr("stroke", "#017188").attr("d", line);
  g.append("path").datum(samples).attr("class", "curve").attr("stroke", "#c3312f").attr("d", line2);
  g.append("text").attr("x", x(1.55)).attr("y", y(0.49)).attr("class", "region-label").attr("fill", "#017188").text("p(x, C₁)");
  g.append("text").attr("x", x(4.12)).attr("y", y(0.49)).attr("class", "region-label").attr("fill", "#c3312f").text("p(x, C₂)");

  const boundaryGroup = g.append("g");
  const boundary = boundaryGroup.append("line").attr("class", "boundary");
  const hit = boundaryGroup.append("line").attr("class", "boundary-hit");
  const handle = boundaryGroup.append("circle").attr("class", "handle").attr("r", 7).attr("cy", plot.top + 10);
  const boundaryText = boundaryGroup.append("text").attr("text-anchor", "middle").attr("font-size", 14).attr("y", 28).text("Decision boundary");

  g.append("text").attr("x", matrix.left + matrix.size / 2).attr("y", matrix.top - 17).attr("text-anchor", "middle").attr("font-size", 15).text("Actual class");
  g.append("text").attr("x", matrix.left + matrix.size * 0.25).attr("y", matrix.top + matrix.size + 25).attr("class", "matrix-label").attr("text-anchor", "middle").text("C₁");
  g.append("text").attr("x", matrix.left + matrix.size * 0.75).attr("y", matrix.top + matrix.size + 25).attr("class", "matrix-label").attr("text-anchor", "middle").text("C₂");
  g.append("text").attr("transform", `translate(${matrix.left - 37},${matrix.top + matrix.size / 2}) rotate(-90)`).attr("text-anchor", "middle").attr("font-size", 15).text("Prediction");
  g.append("text").attr("x", matrix.left + matrix.size + 22).attr("y", matrix.top + matrix.size * 0.25 + 5).attr("class", "matrix-label").attr("text-anchor", "middle").text("C₁");
  g.append("text").attr("x", matrix.left + matrix.size + 22).attr("y", matrix.top + matrix.size * 0.75 + 5).attr("class", "matrix-label").attr("text-anchor", "middle").text("C₂");

  const cells = [
    { key: "tn", col: 0, row: 0, color: "#017188", opacity: 0.2 },
    { key: "tp", col: 1, row: 1, color: "#c3312f", opacity: 0.2 }
  ];
  const cellSize = matrix.size / 2;
  const matrixFills = g.append("g");
  const cellRects = matrixFills.selectAll("rect").data(cells).join("rect")
    .attr("fill", d => d.color).attr("fill-opacity", d => d.opacity);
  const greenLight = matrixFills.append("polygon").attr("fill", "#99d28c");
  const greenDark = matrixFills.append("polygon").attr("fill", "#00a390");
  const greenDiagonal = matrixFills.append("line").attr("class", "matrix-divider");
  const blueLight = matrixFills.append("polygon").attr("fill", "#70b7cb");
  const blueDark = matrixFills.append("polygon").attr("fill", "#0066a2");
  const blueDiagonal = matrixFills.append("line").attr("class", "matrix-divider");
  g.append("rect").attr("class", "matrix-outline").attr("x", matrix.left).attr("y", matrix.top).attr("width", matrix.size).attr("height", matrix.size);
  g.append("line").attr("class", "matrix-divider").attr("x1", matrix.left + cellSize).attr("x2", matrix.left + cellSize).attr("y1", matrix.top).attr("y2", matrix.top + matrix.size);
  g.append("line").attr("class", "matrix-divider").attr("x1", matrix.left).attr("x2", matrix.left + matrix.size).attr("y1", matrix.top + cellSize).attr("y2", matrix.top + cellSize);

  const integral = (fn, a, b) => {
    const n = 500, step = (b - a) / n;
    let total = 0;
    for (let i = 0; i < n; i++) total += (fn(a + i * step) + fn(a + (i + 1) * step)) * step / 2;
    return total;
  };
  const maxValues = {
    tn: integral(density1, ...domain), fp: integral(density1, ...domain),
    fn: integral(density2, ...domain), tp: integral(density2, ...domain)
  };
  let decision = 3.7;

  function update() {
    const bx = x(decision);
    const left1 = samples.filter(v => v <= decision);
    const right1 = samples.filter(v => v >= decision);
    correctArea1.datum(left1).attr("d", areaFor(density1));
    correctArea2.datum(right1).attr("d", areaFor(density2));
    greenOverlapArea.datum(left1).attr("d", areaFor(overlap));
    greenExcessArea.datum(left1).attr("d", areaBetween(overlap, density2));
    blueOverlapArea.datum(right1).attr("d", areaFor(overlap));
    blueExcessArea.datum(right1).attr("d", areaBetween(overlap, density1));
    [boundary, hit].forEach(s => s.attr("x1", bx).attr("x2", bx).attr("y1", plot.top).attr("y2", plot.bottom));
    handle.attr("cx", bx);
    boundaryText.attr("x", bx);

    const values = {
      tn: integral(density1, domain[0], decision), fp: integral(density1, decision, domain[1]),
      fn: integral(density2, domain[0], decision), tp: integral(density2, decision, domain[1])
    };
    cellRects.each(function(d) {
      const proportion = Math.max(0, Math.min(1, values[d.key] / maxValues[d.key]));
      const side = cellSize * Math.sqrt(proportion) * 0.9;
      d3v.select(this)
        .attr("x", matrix.left + d.col * cellSize + (cellSize - side) / 2)
        .attr("y", matrix.top + d.row * cellSize + (cellSize - side) / 2)
        .attr("width", side).attr("height", side);
    });
    const clipDiagonal = (polygon, threshold, keepLower) => {
      const output = [];
      polygon.forEach((point, index) => {
        const previous = polygon[(index + polygon.length - 1) % polygon.length];
        const pointInside = keepLower ? point[0] + point[1] <= threshold : point[0] + point[1] >= threshold;
        const previousInside = keepLower ? previous[0] + previous[1] <= threshold : previous[0] + previous[1] >= threshold;
        if (pointInside !== previousInside) {
          const ratio = (threshold - previous[0] - previous[1]) /
            ((point[0] + point[1]) - (previous[0] + previous[1]));
          output.push([
            previous[0] + ratio * (point[0] - previous[0]),
            previous[1] + ratio * (point[1] - previous[1])
          ]);
        }
        if (pointInside) output.push(point);
      });
      return output;
    };
    const setErrorCell = (light, dark, divider, col, row, total, maximum, lightValue) => {
      const side = cellSize * Math.sqrt(total / maximum) * 0.9;
      const x0 = matrix.left + col * cellSize + (cellSize - side) / 2;
      const y0 = matrix.top + row * cellSize + (cellSize - side) / 2;
      const lightShare = total > 0 ? Math.max(0, Math.min(1, lightValue / total)) : 0;
      const threshold = lightShare <= 0.5
        ? Math.sqrt(2 * lightShare)
        : 2 - Math.sqrt(2 * (1 - lightShare));
      const square = [[0, 0], [1, 0], [1, 1], [0, 1]];
      const toPoints = polygon => polygon.map(([px, py]) => `${x0 + px * side},${y0 + py * side}`).join(" ");
      light.attr("points", toPoints(clipDiagonal(square, threshold, true)));
      dark.attr("points", toPoints(clipDiagonal(square, threshold, false)));

      if (lightShare <= 0 || lightShare >= 1) {
        divider.attr("display", "none");
      } else {
        const endpoints = threshold <= 1
          ? [[0, threshold], [threshold, 0]]
          : [[threshold - 1, 1], [1, threshold - 1]];
        divider.attr("display", null)
          .attr("x1", x0 + endpoints[0][0] * side).attr("y1", y0 + endpoints[0][1] * side)
          .attr("x2", x0 + endpoints[1][0] * side).attr("y2", y0 + endpoints[1][1] * side);
      }
    };
    const greenLightValue = integral(excess2, domain[0], decision);
    const blueLightValue = integral(excess1, decision, domain[1]);
    setErrorCell(greenLight, greenDark, greenDiagonal, 1, 0, values.fn, maxValues.fn, greenLightValue);
    setErrorCell(blueLight, blueDark, blueDiagonal, 0, 1, values.fp, maxValues.fp, blueLightValue);
  }

  boundaryGroup.call(d3v.drag().on("drag", event => {
    decision = Math.max(domain[0] + 0.05, Math.min(domain[1] - 0.05, x.invert(event.x)));
    update();
  }));
  svg.on("pointerdown", event => {
    const [px, py] = d3v.pointer(event);
    if (px >= plot.left && px <= plot.right && py >= plot.top && py <= plot.bottom) {
      decision = x.invert(px); update();
    }
  });
  update();
})();
</script>
</body>
</html>
