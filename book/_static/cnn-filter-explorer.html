<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter a weather signal</title>
  <style>
    :root { --ink: #16324a; --muted: #465d6e; --blue: #0076c2; --purple: #6f1d77; --border: #dde3ea; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: var(--ink); background: #fff; }
    main { padding: 12px; }
    article { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(12,35,64,.06); }
    .toolbar { padding: 13px 15px; background: #f7f9fb; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 1.15rem; line-height: 1.25; }
    p { margin: 0; }
    #station-info, .help, footer { color: var(--muted); font-size: .81rem; }
    #station-info { margin: 4px 0 12px; }
    .settings { display: flex; gap: 8px 12px; flex-wrap: wrap; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: .83rem; font-weight: 600; }
    .signal { flex: 2 1 195px; min-width: 0; }
    .preset { flex: 1 1 150px; }
    .parameter { flex: 1 1 68px; }
    select, input, button { font: inherit; color: var(--ink); }
    select, input[type=text], input[type=number] { width: 100%; min-width: 0; background: white; border: 1px solid #b6c4d0; border-radius: 6px; padding: 5px 7px; font-size: .88rem; font-weight: 400; }
    select { min-height: 33px; }
    input:disabled { background: #f4f6f8; color: #5c6971; }
    input[type=checkbox] { accent-color: var(--blue); }
    button { border: 1px solid var(--blue); background: #fff; color: #005e9c; border-radius: 999px; padding: 7px 14px; font-size: .86rem; font-weight: 650; cursor: pointer; }
    button:hover { background: #e6f2fa; }
    input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible, svg:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    input[aria-invalid=true] { border-color: #a13428; }
    .weights-row { margin-top: 11px; display: flex; gap: 8px 14px; align-items: end; flex-wrap: wrap; }
    fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
    legend { padding: 0; font-size: .85rem; font-weight: 650; }
    legend span { color: var(--muted); font-weight: 400; }
    #weights { display: flex; gap: 5px; flex-wrap: wrap; }
    .tap { width: 57px; font-size: .74rem; color: var(--muted); line-height: 1.25; }
    .tap span { display: block; margin: 4px 0 3px; }
    #status { margin-top: 8px; color: var(--muted); font-size: .81rem; }
    .error { color: #9a3124 !important; }
    .plot-wrap { padding: 13px 14px 4px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .83rem; font-weight: 650; }
    .legend span::before { content: ""; display: inline-block; width: 21px; margin-right: 6px; vertical-align: middle; border-top: 2px solid currentColor; }
    #input-key { color: #005f9e; }
    #output-key { color: var(--purple); }
    #output-key::before { border-top-style: dashed; }
    #chart { width: 100%; height: 230px; display: block; }
    #chart text { font: 11px system-ui, sans-serif; }
    #chart .axis-title { fill: var(--muted); font-size: 12px; }
    #readout { min-height: 1.4em; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    details { margin: 9px 14px 12px; border-top: 1px solid var(--border); padding-top: 8px; font-size: .84rem; }
    summary { cursor: pointer; font-weight: 650; width: fit-content; }
    .ranges { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 215px), 1fr)); gap: 10px 16px; margin-top: 8px; }
    .range-row { display: grid; grid-template-columns: auto 1fr 1fr; align-items: end; gap: 7px; }
    .range-row label:first-child { padding-bottom: 6px; white-space: nowrap; }
    .range-row .field { font-size: .75rem; }
    #axis-error { font-size: .82rem; margin-top: 4px; }
    footer { background: #f7f9fb; padding: 8px 14px; border-top: 1px solid var(--border); line-height: 1.45; }
    a { color: #005f9e; }
    @media(max-width: 520px) {
      main { padding: 8px; }
      .toolbar { padding: 11px; }
      .signal { flex-basis: 100%; }
      .preset { flex-basis: 100%; }
      .tap { width: 50px; }
      .plot-wrap { padding: 10px 5px 3px; }
      .legend, #readout { padding: 0 5px; }
      #chart { height: 215px; }
      details { margin-inline: 10px; }
      footer { padding-inline: 10px; }
    }
  </style>
</head>
<body>
<main id="shell">
  <article aria-labelledby="heading">
    <form class="toolbar" id="filter-form" novalidate>
      <h1 id="heading">Filter a weather signal</h1>
      <p id="station-info"></p>
      <div class="settings">
        <label class="field signal" for="sensor">Station signal<select id="sensor"></select></label>
        <label class="field preset" for="preset">Filter<select id="preset"><option value="mean">Moving average</option><option value="peak">Peak detector</option><option value="custom">Custom weights</option></select></label>
        <label class="field parameter" for="width">Kernel size<select id="width"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></label>
        <label class="field parameter" for="stride">Stride<select id="stride"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
        <label class="field parameter" for="dilation">Dilation<select id="dilation"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      </div>
      <div class="weights-row">
        <fieldset>
          <legend>Kernel weights <span>· offsets from centre</span></legend>
          <div id="weights"></div>
        </fieldset>
        <button id="apply-filter" type="submit">Apply filter</button>
      </div>
      <p id="status" role="status" aria-live="polite"><span id="plot-summary"></span> <span id="filter-feedback"></span></p>
    </form>
    <div class="plot-wrap">
      <div class="legend"><span id="input-key"></span><span id="output-key"></span></div>
      <svg id="chart" role="img" tabindex="0" aria-labelledby="chart-title chart-desc" aria-describedby="readout"></svg>
      <p id="readout" aria-live="polite">Point at the plot or focus it and use the arrow keys to inspect an hour.</p>
    </div>
    <details id="scales">
      <summary>Y-axis limits</summary>
      <div class="ranges">
        <fieldset><legend>Input · left axis</legend>
          <div class="range-row">
            <label><input type="checkbox" id="input-auto" checked> Auto</label>
            <label class="field" for="input-min">Minimum<input type="number" step="any" id="input-min" disabled></label>
            <label class="field" for="input-max">Maximum<input type="number" step="any" id="input-max" disabled></label>
          </div>
        </fieldset>
        <fieldset><legend>Output · right axis</legend>
          <div class="range-row">
            <label><input type="checkbox" id="output-auto" checked> Auto</label>
            <label class="field" for="output-min">Minimum<input type="number" step="any" id="output-min" disabled></label>
            <label class="field" for="output-max">Maximum<input type="number" step="any" id="output-max" disabled></label>
          </div>
        </fieldset>
      </div>
      <p id="axis-error" class="error" role="status"></p>
    </details>
    <footer><a id="source" target="_blank" rel="noopener">KNMI hourly observations</a> · <a id="licence" target="_blank" rel="noopener"></a><span id="data-note"></span></footer>
  </article>
</main>
<script src="cnn-station-week.js"></script>
<script>
(() => {
  "use strict";
  const byId = id => document.getElementById(id);
  const data = window.CNN_STATION_WEEK;
  const chart = byId("chart");
  const feedback = byId("filter-feedback");
  const sensor = byId("sensor");
  const preset = byId("preset");
  const width = byId("width");
  const stride = byId("stride");
  const dilation = byId("dilation");
  const weights = byId("weights");
  const axes = ["input", "output"];
  const hour = 3600000;
  const ns = "http://www.w3.org/2000/svg";
  const colors = {input: "#0076c2", output: "#6f1d77"};
  const readoutHint = byId("readout").textContent;
  const limits = {};
  let applied, inspected = null, geometry;

  const dayLabel = new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "short", timeZone: "UTC"});
  const timeLabel = new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "UTC"});

  function resizeFrame() {
    try {
      if (window.frameElement) window.frameElement.style.height = Math.ceil(byId("shell").getBoundingClientRect().height) + "px";
    } catch { /* A cross-origin host controls its own iframe height. */ }
  }
  new ResizeObserver(resizeFrame).observe(byId("shell"));

  if (!data || !data.signals.length) {
    feedback.textContent = "The station data could not be loaded.";
    feedback.className = "error";
    byId("apply-filter").disabled = true;
    return;
  }
  const start = Date.parse(data.startUTC);
  for (const signal of data.signals) sensor.add(new Option(signal.label, signal.id));
  sensor.value = data.signals.some(signal => signal.id === "RH") ? "RH" : data.signals[0].id;
  byId("source").href = data.sourceURL;
  byId("licence").href = data.licenceURL;
  byId("licence").textContent = data.licence;
  byId("data-note").textContent = data.note ? " · " + data.note : "";
  const end = start + (data.signals[0].values.length - 1) * hour;
  byId("station-info").textContent = data.station + " · " + timeLabel.format(start) + " – " + timeLabel.format(end) + " UTC, " + new Date(end).getUTCFullYear();

  function setTapControls() {
    const n = Number(width.value);
    const middle = (n - 1) / 2;
    const old = Array.from(weights.querySelectorAll("input"), input => input.value);
    const shift = (old.length - n) / 2;
    const taps = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const offset = (i - middle) * Number(dilation.value);
      const label = document.createElement("label");
      label.className = "tap";
      const caption = document.createElement("span");
      caption.textContent = (offset > 0 ? "+" : "") + String(offset).replace("-", "−") + " h";
      const input = document.createElement("input");
      input.id = "tap-" + i;
      input.type = "text";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.setAttribute("aria-label", "Weight for offset " + offset + " hours");
      if (preset.value === "mean") input.value = n === 1 ? "1" : "1/" + n;
      else if (preset.value === "peak") input.value = String([-1, 2, -1][i]);
      else input.value = old[i + shift] ?? (i === middle && !old.length ? "1" : "0");
      label.append(caption, input);
      taps.appendChild(label);
    }
    weights.replaceChildren(taps);
  }

  function parseWeight(text) {
    const parts = text.trim().replaceAll("−", "-").split("/");
    const decimal = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i;
    if (parts.length > 2 || parts.some(part => !decimal.test(part.trim()))) return NaN;
    const numerator = Number(parts[0]);
    const denominator = parts.length === 2 ? Number(parts[1]) : 1;
    return denominator !== 0 && Number.isFinite(denominator) ? numerator / denominator : NaN;
  }

  function markPending() {
    feedback.className = "";
    feedback.textContent = "Select Apply filter to use your edits.";
  }
  preset.addEventListener("change", () => {
    if (preset.value === "peak") width.value = "3";
    setTapControls();
  });
  width.addEventListener("change", () => {
    if (preset.value === "peak" && width.value !== "3") preset.value = "custom";
    setTapControls();
  });
  dilation.addEventListener("change", setTapControls);
  weights.addEventListener("input", event => {
    preset.value = "custom";
    event.target.removeAttribute("aria-invalid");
    markPending();
  });
  for (const control of [preset, width, stride, dilation]) control.addEventListener("change", markPending);

  function filterSignal(values, taps, step, spacing) {
    const result = [];
    const span = 1 + (taps.length - 1) * spacing;
    for (let left = 0; left + span <= values.length; left += step) {
      let score = 0;
      for (let tap = 0; tap < taps.length; tap++) {
        const value = values[left + tap * spacing];
        if (value === null) { score = null; break; }
        score += value * taps[tap];
      }
      if (score !== null && !Number.isFinite(score)) throw new RangeError("These weights produce values outside the plot’s numeric range.");
      result.push({index: left + (span - 1) / 2, value: score});
    }
    return result;
  }

  function autoRange(series) {
    const values = series.filter(Number.isFinite);
    if (!values.length) return [0, 1];
    const min = Math.min(...values), max = Math.max(...values);
    if (min === max) {
      const margin = Math.abs(min) * .05 || 1;
      return [min - margin, max + margin];
    }
    const margin = (max - min) * .06;
    return [min === 0 ? 0 : min - margin, max === 0 ? 0 : max + margin];
  }

  function updateAuto(axis) {
    const range = autoRange(axis === "input" ? applied.signal.values : applied.points.map(point => point.value));
    limits[axis] = range;
    for (const [i, side] of ["min", "max"].entries()) byId(axis + "-" + side).value = String(Number(range[i].toPrecision(12)));
  }

  function applyFilter(event) {
    if (event) event.preventDefault();
    const fields = [...weights.querySelectorAll("input")];
    const taps = fields.map(field => parseWeight(field.value));
    const bad = taps.findIndex(value => !Number.isFinite(value));
    if (bad !== -1) {
      fields[bad].setAttribute("aria-invalid", "true");
      fields[bad].focus();
      feedback.className = "error";
      feedback.textContent = "Enter a number or a fraction such as 1/3 in each weight. The denominator must be nonzero.";
      return;
    }
    if (refreshSignal({taps, step: Number(stride.value), spacing: Number(dilation.value)})) {
      feedback.className = "";
      feedback.textContent = "";
    }
  }

  function refreshSignal(filter) {
    const signal = data.signals.find(item => item.id === sensor.value);
    const {taps, step, spacing} = filter;
    let points;
    try {
      points = filterSignal(signal.values, taps, step, spacing);
      const domain = autoRange(points.map(point => point.value));
      if (!Number.isFinite(domain[1] - domain[0])) throw new RangeError("Use smaller weights so the output fits the plot’s numeric range.");
    } catch (error) {
      if (applied) sensor.value = applied.signal.id;
      feedback.textContent = error.message;
      feedback.className = "error";
      return false;
    }
    const changedSignal = applied && signal !== applied.signal;
    applied = {signal, filter, points, scores: new Map(points.map(point => [point.index, point.value]))};
    inspected = null;
    for (const axis of axes) {
      const auto = byId(axis + "-auto");
      if (changedSignal) auto.checked = true;
      if (auto.checked) updateAuto(axis);
      for (const side of ["min", "max"]) byId(axis + "-" + side).disabled = auto.checked;
    }
    validateAxes();
    byId("input-key").textContent = signal.label + " (" + signal.unit + ") · left";
    byId("output-key").textContent = "Filter output (" + signal.unit + ") · right";
    const count = points.filter(point => point.value !== null).length;
    const missing = points.length - count;
    byId("plot-summary").textContent = signal.values.length + " hourly samples · " + count + " outputs · " +
      (1 + (taps.length - 1) * spacing) + "-sample window span · stride " + step +
      (missing ? " · " + missing + (missing === 1 ? " window missing observations" : " windows missing observations") : "");
    draw();
    return true;
  }
  sensor.addEventListener("change", () => refreshSignal(applied.filter));
  byId("filter-form").addEventListener("submit", applyFilter);

  function validateAxes() {
    const errors = [];
    for (const axis of axes) {
      const min = byId(axis + "-min"), max = byId(axis + "-max");
      let valid = true;
      if (!byId(axis + "-auto").checked) {
        const a = min.valueAsNumber, b = max.valueAsNumber;
        valid = Number.isFinite(a) && Number.isFinite(b) && b > a && Number.isFinite(b - a);
        if (valid) limits[axis] = [a,b];
        else errors.push((axis === "input" ? "Input" : "Output") + " limits need a numeric minimum below the maximum.");
      }
      [min,max].forEach(field => field.setAttribute("aria-invalid", String(!valid)));
    }
    byId("axis-error").textContent = errors.join(" ");
  }

  for (const axis of axes) {
    const auto = byId(axis + "-auto");
    auto.addEventListener("change", () => {
      for (const side of ["min","max"]) byId(axis + "-" + side).disabled = auto.checked;
      if (auto.checked) updateAuto(axis);
      validateAxes();
      draw();
    });
    for (const side of ["min","max"]) {
      byId(axis + "-" + side).addEventListener("input", () => { validateAxes(); draw(); });
    }
  }

  function element(tag, attrs, content) {
    const node = document.createElementNS(ns, tag);
    for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
    if (content !== undefined) node.textContent = content;
    return node;
  }
  function tickLabel(value, step) {
    if (value === 0) return "0";
    if (Math.abs(value) >= 1e5 || step < .0001) return value.toExponential(1);
    return String(Number(value.toFixed(Math.min(8, Math.max(0, 1 - Math.floor(Math.log10(step)))))));
  }

  function draw() {
    if (!applied) return;
    const w = chart.clientWidth, h = chart.clientHeight;
    if (w <= 0 || h <= 0) return;
    const divisions = 4, ticks = {};
    for (const axis of axes) {
      const [a,b] = limits[axis], step = (b-a)/divisions;
      ticks[axis] = Array.from({length: divisions + 1}, (_, i) => tickLabel(a + (b-a)*(i/divisions), step));
    }
    const gutter = axis => Math.max(32, ...ticks[axis].map(value => 9 + value.length*7));
    const left = gutter("input"), right = Math.max(left+1, w-gutter("output")), top = 14, bottom = h-46;
    const n = applied.signal.values.length;
    const x = index => left + (right-left)*index/(n-1);
    const y = (value, axis) => {
      const [a,b] = limits[axis];
      const ratio = (value-a)/(b-a);
      return bottom - (bottom-top)*Math.max(-10000,Math.min(10000,ratio));
    };
    geometry = {left,right,top,bottom,x};
    const nodes = [
      element("title",{id:"chart-title"},applied.signal.label + " and filter output"),
      element("desc",{id:"chart-desc"},"Hourly observations use the left axis. Dashed filter output is centred on each valid window and uses the right axis. All times are UTC."),
      element("rect",{x:left,y:top,width:right-left,height:bottom-top,fill:"#eaeaf2"})
    ];
    chart.setAttribute("viewBox","0 0 " + w + " " + h);
    for (let i = 0; i <= divisions; i++) {
      const ty = bottom-(bottom-top)*i/divisions;
      nodes.push(element("line",{x1:left,y1:ty,x2:right,y2:ty,stroke:"#fff","stroke-width":1.5}));
      nodes.push(element("text",{x:left-5,y:ty+3,"text-anchor":"end",fill:"#005f9e"},ticks.input[i]));
      nodes.push(element("text",{x:right+5,y:ty+3,fill:colors.output},ticks.output[i]));
    }
    const strideDays = w < 470 ? 2 : 1;
    const firstMidnight = Math.ceil(start/86400000)*86400000;
    for (let t=firstMidnight; t<=start+(n-1)*hour; t+=strideDays*86400000) {
      const tx = x((t-start)/hour);
      nodes.push(element("line",{x1:tx,y1:top,x2:tx,y2:bottom,stroke:"white"}));
      nodes.push(element("text",{x:tx,y:bottom+17,"text-anchor":"middle",fill:"#465d6e"},dayLabel.format(t)));
    }
    nodes.push(element("text",{x:(left+right)/2,y:h-5,"text-anchor":"middle",class:"axis-title"},"Time (UTC)"));
    const clip = element("clipPath",{id:"plot-clip"});
    clip.appendChild(element("rect",{x:left,y:top,width:right-left,height:bottom-top}));
    const defs = element("defs",{}); defs.appendChild(clip); nodes.push(defs);
    const traces = element("g",{"clip-path":"url(#plot-clip)"});
    function addTrace(points, axis) {
      let d = "", penDown = false;
      for (const {index,value} of points) {
        if (value === null) { penDown = false; continue; }
        const px=x(index), py=y(value,axis);
        d += (penDown ? "L" : "M") + px.toFixed(2) + " " + py.toFixed(2) + " ";
        penDown = true;
        if (axis === "output") traces.appendChild(element("circle",{cx:px,cy:py,r:1.65,fill:colors.output}));
      }
      const path = element("path",{id:axis+"-trace",d,fill:"none",stroke:colors[axis],"stroke-width":axis==="input"?2:1.65});
      if (axis==="output") path.setAttribute("stroke-dasharray","4 3");
      traces.appendChild(path);
    }
    addTrace(applied.signal.values.map((value,index)=>({index,value})),"input");
    addTrace(applied.points,"output");
    nodes.push(traces);
    nodes.push(element("line",{id:"cursor",y1:top,y2:bottom,stroke:"#526477","stroke-dasharray":"2 3",visibility:"hidden"}));
    chart.replaceChildren(...nodes);
    showValue(inspected);
  }

  function showValue(index) {
    inspected = index;
    const cursor = byId("cursor");
    if (!cursor) return;
    if (index === null) {
      cursor.setAttribute("visibility", "hidden");
      byId("readout").textContent = readoutHint;
      return;
    }
    const px=geometry.x(index);
    cursor.setAttribute("x1",px); cursor.setAttribute("x2",px); cursor.setAttribute("visibility","visible");
    const fmt = value => value === null ? "missing" : Number(value.toPrecision(5)).toString();
    const value = applied.scores.has(index) ? fmt(applied.scores.get(index)) : "no window here";
    byId("readout").textContent = timeLabel.format(start+index*hour) + " UTC · Input " + fmt(applied.signal.values[index]) + " · Output " + value;
  }
  function inspectPointer(event) {
    if (!geometry) return;
    const px = event.clientX-chart.getBoundingClientRect().left;
    const frac = (px-geometry.left)/(geometry.right-geometry.left);
    showValue(Math.round(Math.max(0,Math.min(1,frac))*(applied.signal.values.length-1)));
  }
  chart.addEventListener("pointermove", inspectPointer);
  chart.addEventListener("pointerdown", inspectPointer);
  chart.addEventListener("pointerleave", () => { if (document.activeElement !== chart) showValue(null); });
  chart.addEventListener("focus", () => { if (inspected === null) showValue(0); });
  chart.addEventListener("blur", () => showValue(null));
  chart.addEventListener("keydown", event => {
    const last = applied.signal.values.length-1, current = inspected ?? 0;
    const next = {ArrowLeft:Math.max(0,current-1),ArrowRight:Math.min(last,current+1),Home:0,End:last};
    if (Object.hasOwn(next,event.key)) { event.preventDefault(); showValue(next[event.key]); }
  });
  new ResizeObserver(draw).observe(chart);
  setTapControls();
  applyFilter();
})();
</script>
</body>
</html>
