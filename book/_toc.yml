# Configuration of _toc.yml file is explained in detail here: https://jupyterbook.org/en/stable/structure/toc.html and https://sphinx-external-toc.readthedocs.io/en/latest/user_guide/sphinx.html

format: jb-book
root: intro.md

parts:
  - caption: Logistics # A title for the whole the subtree, e.g. shown above the subtree in ToCs, configuration part of sphinx-external-toc (https://sphinx-external-toc.readthedocs.io/en/latest/intro.html)
    numbered: false                 # Default value (line can be removed), whether to number the chapters/sections in this part, configuration part of sphinx-external-toc (https://sphinx-external-toc.readthedocs.io/en/latest/intro.html)
    style: numerical                # Default value (line can be removed), style of numbering for this part, configuration part of TeachBooks' version of sphinx-external-toc (https://github.com/TeachBooks/sphinx-external-toc?tab=readme-ov-file#toc-tree-options)
    restart_numbering: false        # Default value (line can be removed), whether to restart numbering for this part, configuration part of TeachBooks' version of sphinx-external-toc (https://github.com/TeachBooks/sphinx-external-toc?tab=readme-ov-file#toc-tree-options)
    chapters:
    - file: logistics/schedule.md
    - file: logistics/projects.md
    - file: logistics/exams.md
  - caption: Coding
    chapters:
    - file: coding/environment.md
    - file: coding/pytorch.md
      sections:
      - file: coding/exercises-clean/intro
      - file: coding/exercises/intro
      - file: coding/exercises-clean/application
      - file: coding/exercises/application
  - caption: Probabilistic Machine Learning
    chapters:
    - file: preliminaries/overview.md
      sections:
      - file: preliminaries/probability_theory
      - file: preliminaries/graph_models
      - file: preliminaries/bayes_theorem
      - file: preliminaries/probability_distributions
      - file: preliminaries/review
    - file: frequentist/overview.md
      sections:
      - file: frequentist/knn
      - file: frequentist/decision_theory
      - file: frequentist/linear_models
      - file: frequentist/ridge_sgd
      - file: frequentist/nn
