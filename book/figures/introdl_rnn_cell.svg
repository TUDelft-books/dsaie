<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
  <title id="title">A recurrent update and three shared cells</title>
  <desc id="desc">Input x_t and previous hidden state h_(t-1) enter a simple RNN cell to produce h_t. Below, inputs at t-1, t and t+1 enter three cells with shared parameters; hidden states connect successive cells.</desc>
  <defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0076c2"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f1d77"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ec6842"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#243447"/></marker>
</defs><rect width="480" height="440" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243447">
<rect x="174" y="70" width="138" height="70" rx="7" fill="#f1f8fc" stroke="#0076c2" stroke-width="2"/>
<text x="243" y="112" font-size="23" fill="#243447" text-anchor="middle" font-weight="700" >RNN cell</text>
<text x="243" y="27" font-size="24" fill="#0076c2" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="17.28">t</tspan></text>
<path d="M 243 37 V 66" fill="none" stroke="#0076c2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="64" y="111" font-size="24" fill="#6f1d77" text-anchor="middle" ><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="17.28">t−1</tspan></text>
<path d="M 107 105 H 169" fill="none" stroke="#6f1d77" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<path d="M 317 105 H 379" fill="none" stroke="#6f1d77" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<text x="417" y="111" font-size="24" fill="#6f1d77" text-anchor="middle" ><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="17.28">t</tspan></text>
<text x="240" y="190" font-size="22" fill="#243447" text-anchor="middle" ><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="15.84">t</tspan> = φ(<tspan font-style="italic">W</tspan><tspan baseline-shift="sub" font-size="15.84">x</tspan><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="15.84">t</tspan> + <tspan font-style="italic">W</tspan><tspan baseline-shift="sub" font-size="15.84">h</tspan><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="15.84">t−1</tspan> + b)</text>
<path d="M 24 220 H 456" fill="none" stroke="#d9e0e6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="240" y="254" font-size="21" fill="#243447" text-anchor="middle" font-weight="700" >Shared parameters across time</text>
<text x="75" y="302" font-size="24" fill="#0076c2" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="17.28">t−1</tspan></text>
<path d="M 75 313 V 337" fill="none" stroke="#0076c2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="30" y="342" width="90" height="60" rx="7" fill="#f1f8fc" stroke="#0076c2" stroke-width="2"/>
<text x="75" y="379" font-size="22" fill="#243447" text-anchor="middle" font-weight="700" >RNN</text>
<text x="240" y="302" font-size="24" fill="#0076c2" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="17.28">t</tspan></text>
<path d="M 240 313 V 337" fill="none" stroke="#0076c2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="195" y="342" width="90" height="60" rx="7" fill="#f1f8fc" stroke="#0076c2" stroke-width="2"/>
<text x="240" y="379" font-size="22" fill="#243447" text-anchor="middle" font-weight="700" >RNN</text>
<text x="405" y="302" font-size="24" fill="#0076c2" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="17.28">t+1</tspan></text>
<path d="M 405 313 V 337" fill="none" stroke="#0076c2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="360" y="342" width="90" height="60" rx="7" fill="#f1f8fc" stroke="#0076c2" stroke-width="2"/>
<text x="405" y="379" font-size="22" fill="#243447" text-anchor="middle" font-weight="700" >RNN</text>
<path d="M 124 372 H 190" fill="none" stroke="#6f1d77" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<text x="157.5" y="425" font-size="22" fill="#6f1d77" text-anchor="middle" ><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="15.84">t−1</tspan></text>
<path d="M 289 372 H 355" fill="none" stroke="#6f1d77" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<text x="322.5" y="425" font-size="22" fill="#6f1d77" text-anchor="middle" ><tspan font-style="italic">h</tspan><tspan baseline-shift="sub" font-size="15.84">t</tspan></text>
</g>
</svg>
