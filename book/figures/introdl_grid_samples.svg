<svg xmlns="http://www.w3.org/2000/svg" width="480" height="840" viewBox="0 0 480 840" role="img" aria-labelledby="title desc">
  <title id="title">More features create more grid cells at the same resolution</title>
  <desc id="desc">Each feature is divided into five equal intervals. The same five training samples are shown in one, two and three dimensions, giving 5, 25 and 125 grid cells. The 3D grid is displayed as five layers, one for each interval of the third feature; each layer has a 5 by 5 grid over the first two features. Five cells contain a sample in each view, leaving 0, 20 and 120 empty cells. The cell count is 5 to the power d, reaching 9,765,625 for ten features. Dots mark individual observations within cells.</desc>
  <rect width="480" height="840" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243447">
<text x="240" y="29" font-size="23" fill="#243447" text-anchor="middle" font-weight="700" >5 intervals per feature (m = 5)</text>
<circle cx="106" cy="63" r="5" fill="#ec6842"/>
<text x="121" y="70" font-size="20" fill="#243447" text-anchor="start" >Same 5 training samples</text>
<g id="one-feature">
<text x="24" y="113" font-size="23" fill="#243447" text-anchor="start" font-weight="700" >1 feature</text>
<text x="456" y="113" font-size="23" fill="#6f1d77" text-anchor="end" font-weight="700" >5<tspan baseline-shift="super" font-size="16.56">1</tspan> = 5 cells</text>
<path d="M 40 155 H 440" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<path d="M 40 145 V 165" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<path d="M 120 145 V 165" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<path d="M 200 145 V 165" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<path d="M 280 145 V 165" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<path d="M 360 145 V 165" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<path d="M 440 145 V 165" fill="none" stroke="#0076c2" stroke-width="2" stroke-linecap="round"/>
<circle data-sample="0" cx="84.00" cy="155.00" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<circle data-sample="1" cx="168.00" cy="155.00" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<circle data-sample="2" cx="252.00" cy="155.00" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<circle data-sample="3" cx="312.00" cy="155.00" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<circle data-sample="4" cx="408.00" cy="155.00" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<text x="40" y="187" font-size="18" fill="#243447" text-anchor="middle" >0</text>
<text x="440" y="187" font-size="18" fill="#243447" text-anchor="middle" >1</text>
<text x="240" y="188" font-size="21" fill="#243447" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="15.12">1</tspan></text>
</g>
<path d="M 24 213 H 456" fill="none" stroke="#d9e0e6" stroke-width="1" stroke-linecap="round"/>
<g id="two-features">
<text x="24" y="247" font-size="23" fill="#243447" text-anchor="start" font-weight="700" >2 features</text>
<text x="456" y="247" font-size="23" fill="#6f1d77" text-anchor="end" font-weight="700" >5<tspan baseline-shift="super" font-size="16.56">2</tspan> = 25 cells</text>
<rect x="58" y="281" width="160" height="160" fill="white" stroke="#0076c2" stroke-width="2"/>
