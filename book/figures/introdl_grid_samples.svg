</g>
<path d="M 24 758 H 456" fill="none" stroke="#d9e0e6" stroke-width="1" stroke-linecap="round"/>
<text x="240" y="790" font-size="22" fill="#243447" text-anchor="middle" font-weight="700" >Grid cells at fixed resolution: 5<tspan baseline-shift="super" font-size="15.84">d</tspan></text>
<text x="240" y="823" font-size="22" fill="#6f1d77" text-anchor="middle" >10 features → 9,765,625 cells</text>
