<circle data-sample="2" cx="142.80" cy="351.40" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<circle data-sample="3" cx="166.80" cy="295.40" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<circle data-sample="4" cx="205.20" cy="386.60" r="6" fill="#ec6842" stroke="white" stroke-width="1"/>
<text x="138" y="475" font-size="21" fill="#243447" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="15.12">1</tspan></text>
<text x="28" y="367" font-size="21" fill="#243447" text-anchor="middle" ><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="15.12">2</tspan></text>
<text x="282" y="332" font-size="21" fill="#243447" text-anchor="start" >5 cells with</text>
<text x="282" y="360" font-size="21" fill="#243447" text-anchor="start" >a sample</text>
<text x="282" y="412" font-size="21" fill="#6f1d77" text-anchor="start" >20 empty cells</text>
</g>
<path d="M 24 505 H 456" fill="none" stroke="#d9e0e6" stroke-width="1" stroke-linecap="round"/>
<g id="three-features">
<text x="24" y="538" font-size="23" fill="#243447" text-anchor="start" font-weight="700" >3 features</text>
<text x="456" y="538" font-size="23" fill="#6f1d77" text-anchor="end" font-weight="700" >5<tspan baseline-shift="super" font-size="16.56">3</tspan> = 125 cells</text>
<text x="240" y="573" font-size="20" fill="#243447" text-anchor="middle" >One 3D grid · five layers along <tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="14.4">3</tspan></text>
<g id="layer-1" data-x3-interval="0,0.2">
<text x="56" y="606" font-size="18" fill="#243447" text-anchor="middle" >0–0.2</text>
