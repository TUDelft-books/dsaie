<path d="M 264 620 V 700 M 200 684 H 280" fill="none" stroke="#0076c2" stroke-width="1.5" stroke-linecap="round"/>
<circle data-sample="0" cx="208.80" cy="641.60" r="4" fill="#ec6842" stroke="white" stroke-width="1"/>
</g>
<g id="layer-4" data-x3-interval="0.6,0.8">
<text x="332" y="606" font-size="18" fill="#243447" text-anchor="middle" >0.6–0.8</text>
<rect x="292" y="620" width="80" height="80" fill="white" stroke="#0076c2" stroke-width="2"/>
