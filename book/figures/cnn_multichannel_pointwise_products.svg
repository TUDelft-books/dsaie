  <text x="442" y="27" font-size="17" text-anchor="middle" fill="#16324a" font-weight="bold">Pointwise products</text>
  <text x="603" y="27" font-size="17" text-anchor="middle" fill="#16324a" font-weight="bold">Channel sum</text>
