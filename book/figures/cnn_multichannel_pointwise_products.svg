<svg xmlns="http://www.w3.org/2000/svg" width="680" height="382" viewBox="0 0 680 382" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#16324a">
  <title id="title">One 2D filter combines three input channels at one spatial position</title>
  <desc id="desc">At one position, each input channel supplies a three-by-three patch. The circled dot means that each patch value is multiplied by the weight in the matching cell. After each equals sign, a three-by-three grid shows all nine products. Summing the products in channels 1, 2 and 3 gives 5, 1 and 3 respectively. Adding these subtotals and the bias of minus 2 gives an output of 7.</desc>
