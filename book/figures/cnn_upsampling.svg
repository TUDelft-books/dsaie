  <text x="371" y="35" font-size="17" text-anchor="start" fill="#16324a" font-weight="bold">Fine grid</text>
  <text x="371" y="61" font-size="16" text-anchor="start" fill="#496171">4 × 4 cells in each panel</text>
  <line x1="22" y1="89" x2="658" y2="89" stroke="#b8c8d2" stroke-width="1" />
