<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#16324a">
  <title id="title">Three ways to upsample a pooled feature map</title>
  <desc id="desc">The pooled feature map has rows (1, 3) and (5, 9). (a) Nearest neighbour repeats each value in a 2 by 2 block. (b) Max unpooling places each value at its saved input position and sets every other location to zero. (c) Coarse samples coincide with fine rows and columns 1 and 3. Rows and columns 2 and 4 are half-steps. Exterior coarse samples are zero. The four interior samples have equal weight at fine cell (2,2), where the result is 4.5.</desc>
