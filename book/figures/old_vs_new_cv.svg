<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540"
     role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#16324a">
  <title id="title">Hand-crafted features and features learned by a CNN</title>
  <desc id="desc">The same schematic landscape image feeds two classification routes.
    On the left, a designer chooses fixed edge and texture measurements, shown as a histogram.
    Only the classifier is trained from labelled images. On the right, convolutional filters
    produce successive feature maps. The filters and classification head are trained together
    from labelled images within one blue boundary. Both routes produce class scores.
    Arrows show the forward flow of image information.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#40566a"/>
    </marker>
    <g id="map">
      <rect width="40" height="48" rx="1" fill="#edf6fb" stroke="#0076c2" stroke-width="1.5"/>
      <path d="M10 0v48m10-48v48m10-48v48M0 12h40M0 24h40M0 36h40"
            fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g id="scores" fill="#0076c2">
      <rect width="68" height="6" rx="1"/>
      <rect y="10" width="39" height="6" rx="1"/>
      <rect y="20" width="19" height="6" rx="1"/>
    </g>
  </defs>
  <rect width="640" height="540" fill="#fff"/>

  <!-- A schematic image drawn only with elementary shapes. -->
  <g transform="translate(218 8)">
    <rect width="78" height="56" rx="3" fill="#edf6fb" stroke="#8aa2b4" stroke-width="1.5"/>
    <circle cx="60" cy="14" r="6" fill="#ec6842"/>
    <path d="M1 40 21 22 44 42 59 31 77 45V55H1Z" fill="#bfd5e2"/>
    <path d="M1 44Q27 34 52 47T77 44V55H1Z" fill="#7fa5bb"/>
  </g>
  <text x="310" y="43" font-size="23" font-weight="bold">Input image</text>
  <g fill="none" stroke="#40566a" stroke-width="2" stroke-linejoin="round">
    <path d="M320 66V81H162V98" marker-end="url(#arrow)"/>
    <path d="M320 81H478V98" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle" font-size="22" font-weight="bold">
    <text x="162" y="126">Hand-crafted features</text>
    <text x="478" y="126">Learned features (CNN)</text>
  </g>

  <!-- Fixed feature calculations are outside the trained boundary. -->
  <rect x="16" y="146" width="292" height="134" rx="6" fill="#fff5f0" stroke="#ec6842" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="162" y="175" font-size="21" font-weight="bold">Chosen measurements</text>
    <text x="162" y="201" font-size="20">Fixed during training</text>
  </g>
  <g transform="translate(54 216)">
    <path d="M0 35H92" stroke="#9f6551" stroke-width="1.5"/>
    <g fill="#ec6842">
      <rect x="6" y="18" width="12" height="16"/>
      <rect x="27" y="3" width="12" height="31"/>
      <rect x="48" y="11" width="12" height="23"/>
      <rect x="69" y="24" width="12" height="10"/>
    </g>
  </g>
  <text x="165" y="232" font-size="20">Edges,</text>
  <text x="165" y="256" font-size="20">textures, …</text>
  <path d="M162 284V306" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="16" y="314" width="292" height="112" rx="6" fill="#edf6fb" stroke="#0076c2" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="162" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#005f99">Trained from labels</text>
  <rect x="32" y="354" width="260" height="55" rx="4" fill="#fff" stroke="#8aa2b4" stroke-width="1.3"/>
  <text x="162" y="389" text-anchor="middle" font-size="22" font-weight="bold">Classifier</text>

  <!-- One boundary encloses all trainable stages in the CNN route. -->
  <rect x="332" y="146" width="292" height="280" rx="6" fill="#edf6fb" stroke="#0076c2" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="478" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#005f99">Trained together</text>
  <rect x="348" y="190" width="260" height="128" rx="4" fill="#fff" stroke="#8aa2b4" stroke-width="1.3"/>
  <text x="478" y="218" text-anchor="middle" font-size="21" font-weight="bold">Convolutional filters</text>
  <g transform="translate(371 238)">
    <use href="#map" x="14" y="-8"/>
    <use href="#map" x="7" y="-4"/>
    <use href="#map"/>
    <path d="M8 8H16V20H24V28H32V36H24V28H16V20H8Z" fill="#0076c2"/>
  </g>
  <path d="M438 260H482" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(504 244) scale(.8)">
    <use href="#map" x="21" y="-12"/>
    <use href="#map" x="14" y="-8"/>
    <use href="#map" x="7" y="-4"/>
    <use href="#map"/>
    <rect x="10" y="12" width="20" height="12" fill="#0076c2"/>
    <rect x="20" y="24" width="10" height="12" fill="#76b8de"/>
  </g>
  <text x="478" y="309" text-anchor="middle" font-size="20">Feature maps</text>
  <path d="M478 323V345" fill="none" stroke="#40566a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="348" y="354" width="260" height="55" rx="4" fill="#fff" stroke="#8aa2b4" stroke-width="1.3"/>
  <text x="478" y="389" text-anchor="middle" font-size="22" font-weight="bold">Classification head</text>

  <g fill="none" stroke="#40566a" stroke-width="2">
    <path d="M162 430V453" marker-end="url(#arrow)"/>
    <path d="M478 430V453" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="22" font-weight="bold">
    <text x="162" y="481">Class scores</text>
    <text x="478" y="481">Class scores</text>
  </g>
  <use href="#scores" x="128" y="496"/>
  <use href="#scores" x="444" y="496"/>
</svg>
