  <title id="title">A mean filter at the edge of a rainfall raster</title>
  <desc id="desc">A single zero border surrounds a four-by-four rainfall raster. The three-by-three window centred on the bottom-right reading of nine contains rows 4, 6, 0; 5, 9, 0; and 0, 0, 0. The uniform mean is 24 divided by 9, approximately 2.67 millimetres.</desc>
