<svg xmlns="http://www.w3.org/2000/svg" width="680" height="218" viewBox="0 0 680 218"
     role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#16324a">
  <title id="title">A learned filter spreads coarse inputs across a finer output</title>
  <desc id="desc">A coarse feature map has two input positions, A and B. On the five-position
    output, circles show weighted contributions from A at the first three positions.
    Diamonds show weighted contributions from B at the last three positions.
    Both contributions add at the middle position.</desc>
  <rect width="680" height="218" fill="white"/>

  <text x="18" y="43" font-size="19" font-weight="bold">Coarse input</text>
  <text x="18" y="65" font-size="16" fill="#496171">2 positions</text>
  <g stroke="#93a6b3" stroke-width="1.5">
    <rect x="194" y="19" width="230" height="56" fill="#e5f2fa"/>
    <rect x="424" y="19" width="230" height="56" fill="#f1e8f2"/>
  </g>
  <circle cx="295" cy="47" r="9" fill="#0076c2"/>
  <path d="M525 36L536 47 525 58 514 47Z" fill="#6f1d77"/>
  <g font-weight="bold" font-size="21">
    <text x="313" y="54">A</text>
    <text x="543" y="54">B</text>
  </g>

  <text x="424" y="107" text-anchor="middle" font-size="16" fill="#496171">Learned weights scale each contribution.</text>

  <text x="18" y="143" font-size="19" font-weight="bold">Finer output</text>
  <text x="18" y="165" font-size="16" fill="#496171">5 positions</text>
  <g stroke="#93a6b3" stroke-width="1.5" fill="white">
    <rect x="194" y="123" width="460" height="56"/>
    <path d="M286 123V179 M378 123V179 M470 123V179 M562 123V179"/>
  </g>
  <rect x="378.5" y="123.5" width="91" height="55" fill="#f4f2f6" stroke="#536572" stroke-width="1.5"/>
  <g fill="#0076c2">
    <circle cx="240" cy="151" r="9"/>
    <circle cx="332" cy="151" r="9"/>
    <circle cx="400" cy="151" r="9"/>
  </g>
  <g fill="#6f1d77">
    <path d="M448 140L459 151 448 162 437 151Z"/>
    <path d="M516 140L527 151 516 162 505 151Z"/>
    <path d="M608 140L619 151 608 162 597 151Z"/>
  </g>
  <path d="M418 151H430 M424 145V157" fill="none" stroke="#16324a" stroke-width="2.4"/>
  <path d="M424 180V187" fill="none" stroke="#536572" stroke-width="1.3"/>
  <text x="424" y="207" text-anchor="middle" font-size="16" font-weight="bold">The contributions add here.</text>
</svg>
