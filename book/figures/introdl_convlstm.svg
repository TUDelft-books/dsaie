<svg xmlns="http://www.w3.org/2000/svg" width="480" height="661" viewBox="0 0 480 661" role="img" aria-labelledby="title desc">
  <title id="title">Convolutional LSTM cells unrolled through time</title>
  <desc id="desc">Spatial input grids X_(t-1), X_t and X_(t+1) enter three ConvLSTM cells with shared parameters. Each cell uses convolutional gates for input and hidden-state transformations. Separate grid-valued hidden states H and cell states C flow from one timestep to the next.</desc>
