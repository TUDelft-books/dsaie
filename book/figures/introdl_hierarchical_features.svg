<svg xmlns="http://www.w3.org/2000/svg" width="460" height="614" viewBox="0 0 460 614" role="img" aria-labelledby="title desc">
  <title id="title">An illustrative hierarchy of visual features</title>
  <desc id="desc">A hand-drawn building is followed by schematic edge and texture thumbnails, combinations such as a roof and window, and an abstract feature representation leading to the prediction building. These are illustrative features, not measured activations.</desc>
