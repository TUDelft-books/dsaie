<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="690" height="367" viewBox="0 0 690 367" role="img" aria-labelledby="title desc"
     font-family="Arial, Helvetica, sans-serif" fill="#16324a">
  <title id="title">Two filter banks produce two output channels from the same three input channels</title>
  <desc id="desc">The three columns are the three 4 by 4 input channels. An orange 3 by 3 window
    marks the same spatial location on all three. Each bank, A and B, has its own 3 by 3 kernel
    for each input channel. At each valid location, a bank combines the three kernel responses
    and its bias to produce one value. At stride one, four such locations form a 2 by 2 map for
    each bank. Map A and map B stack along the channel axis to give a 2 by 2 by 2 tensor, which
    can be passed to the next layer.</desc>
  <defs>
    <g id="input-plane">
      <rect width="48" height="48" fill="#f4f6f8" stroke="#92a8b7"/>
      <rect width="36" height="36" fill="#fce9df"/>
      <path d="M12 0v48m12-48v48m12-48v48M0 12h48M0 24h48M0 36h48"
            fill="none" stroke="#9daeba"/>
      <rect width="36" height="36" fill="none" stroke="#bc4d2b" stroke-width="2"/>
    </g>
    <g id="kernel">
      <rect width="39" height="39"/>
      <path d="M13 0v39M26 0v39M0 13h39M0 26h39" fill="none"/>
    </g>
    <g id="map">
      <rect width="48" height="48"/>
      <path d="M24 0v48M0 24h48" fill="none"/>
    </g>
  </defs>
  <rect width="690" height="367" fill="white"/>

  <g font-size="14" text-anchor="middle">
    <text x="162" y="22">Channel 1</text>
    <text x="239" y="22">Channel 2</text>
    <text x="316" y="22">Channel 3</text>
  </g>
  <text x="15" y="53" font-size="16" font-weight="bold">Input tensor</text>
  <text x="15" y="76" font-size="17">4 × 4 × 3</text>
  <use x="138" y="36" xlink:href="#input-plane"/>
  <use x="215" y="36" xlink:href="#input-plane"/>
  <use x="292" y="36" xlink:href="#input-plane"/>
  <text x="377" y="51" font-size="16" font-weight="bold">A window across all channels</text>
  <text x="377" y="75" font-size="15">Its 3 × 3 footprint fits at four positions</text>
  <text x="377" y="95" font-size="15">with unit stride and no padding.</text>
  <path d="M15 109H675" stroke="#c6d2da"/>

  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="239" y="135">One kernel per input channel</text>
    <text x="428" y="135">Output map</text>
    <text x="591" y="135">Stack along channels</text>
  </g>
  <g id="bank-a">
    <rect x="14" y="151" width="345" height="62" rx="5" fill="#edf6fb"/>
    <text x="27" y="188" font-size="18" font-weight="bold" fill="#005f99">Bank A</text>
    <g stroke="#0076c2" fill="white">
      <use x="142.5" y="162.5" xlink:href="#kernel"/>
      <use x="219.5" y="162.5" xlink:href="#kernel"/>
      <use x="296.5" y="162.5" xlink:href="#kernel"/>
    </g>
    <path d="M365 182h30m-6-5 6 5-6 5" fill="none" stroke="#0076c2" stroke-width="2"/>
    <use x="404" y="158" xlink:href="#map" fill="#dceef9" stroke="#0076c2" stroke-width="1.5"/>
    <path d="M460 182h80m-6-5 6 5-6 5" fill="none" stroke="#0076c2" stroke-width="2"/>
  </g>
  <g id="bank-b">
    <rect x="14" y="234" width="345" height="62" rx="5" fill="#f6eff6"/>
    <text x="27" y="271" font-size="18" font-weight="bold" fill="#6f1d77">Bank B</text>
    <g stroke="#6f1d77" fill="white">
      <use x="142.5" y="245.5" xlink:href="#kernel"/>
      <use x="219.5" y="245.5" xlink:href="#kernel"/>
      <use x="296.5" y="245.5" xlink:href="#kernel"/>
    </g>
    <path d="M365 265h30m-6-5 6 5-6 5" fill="none" stroke="#6f1d77" stroke-width="2"/>
    <use x="404" y="241" xlink:href="#map" fill="#eedff0" stroke="#6f1d77" stroke-width="1.5"/>
    <path d="M460 265h106m-6-5 6 5-6 5" fill="none" stroke="#6f1d77" stroke-width="2"/>
  </g>
  <text x="428" y="310" text-anchor="middle" font-size="15">2 × 2 per map</text>

  <!-- The same maps are offset to expose the two channel slices. -->
  <g transform="translate(574 207) scale(1.25)" fill="#eedff0" stroke="#6f1d77" stroke-width="1.2">
    <use xlink:href="#map"/>
  </g>
  <g transform="translate(548 172) scale(1.25)" fill="#dceef9" stroke="#0076c2" stroke-width="1.2">
    <use xlink:href="#map"/>
  </g>
  <text x="617" y="184" font-size="16" font-weight="bold" fill="#005f99">A</text>
  <text x="642" y="261" font-size="16" font-weight="bold" fill="#6f1d77">B</text>
  <text x="591" y="291" text-anchor="middle" font-size="18" font-weight="bold">2 × 2 × 2</text>
  <text x="591" y="311" text-anchor="middle" font-size="14">height × width × channels</text>
  <path d="M15 325H675" stroke="#c6d2da"/>
  <text x="15" y="350" font-size="15">Each bank sums three responses and adds its bias.</text>
  <text x="675" y="350" text-anchor="end" font-size="15" font-weight="bold">Input to the next layer</text>
</svg>
