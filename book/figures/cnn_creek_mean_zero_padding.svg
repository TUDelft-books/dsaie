<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="640" height="344" viewBox="0 0 640 344" role="img">
  <title id="title">Moving average with zero padding</title>
  <desc id="desc">Six hourly creek levels are 40, 40, 60, 40, 40 and 40 cm. Each of the three values in a window has weight one third. The first and last windows each include one padding zero. The means at hours 1 to 6 are 26⅔, 46⅔, 46⅔, 46⅔, 40 and 26⅔ cm.</desc>
  <rect width="640" height="344" fill="#fff" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="21" y="28" font-size="21" fill="#16324a" font-weight="700" text-anchor="start">Moving average with zero padding</text>
    <text x="617" y="28" font-size="16" fill="#40566a" font-weight="400" text-anchor="end">Weights (⅓, ⅓, ⅓)</text>
    <text x="22" y="55" font-size="17" fill="#16324a" font-weight="400" text-anchor="start">Hourly creek levels (cm)   40, 40, 60, 40, 40, 40</text>
    <line x1="20" y1="69" x2="620" y2="69" stroke="#ccd5dd" stroke-width="1" />
    <rect x="20" y="77" width="600" height="30" fill="#e8eef2" rx="3" />
    <text x="75" y="97" font-size="15" fill="#16324a" font-weight="700" text-anchor="middle">Centre hour</text>
    <text x="190" y="97" font-size="15" fill="#16324a" font-weight="700" text-anchor="middle">Earlier</text>
    <text x="315" y="97" font-size="15" fill="#16324a" font-weight="700" text-anchor="middle">Centre</text>
    <text x="440" y="97" font-size="15" fill="#16324a" font-weight="700" text-anchor="middle">Later</text>
    <text x="561" y="97" font-size="15" fill="#16324a" font-weight="700" text-anchor="middle">Mean (cm)</text>
    <rect x="20" y="108" width="600" height="31" fill="#fff" />
    <line x1="20" y1="139" x2="620" y2="139" stroke="#dee5eb" stroke-width="1" />
    <text x="75" y="130" font-size="16" fill="#16324a" font-weight="400" text-anchor="middle">1</text>
    <rect x="149" y="110" width="82" height="26" fill="#fff1e9" stroke="#c87351" rx="4" />
    <text x="190" y="130" font-size="17" fill="#16324a" font-weight="700" text-anchor="middle">x₀ = 0</text>
    <text x="315" y="130" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₁ = 40</text>
    <text x="440" y="130" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₂ = 40</text>
    <text x="561" y="130" font-size="18" fill="#6f1d77" font-weight="700" text-anchor="middle">26⅔</text>
    <rect x="20" y="140" width="600" height="31" fill="#f5f7f9" />
    <line x1="20" y1="171" x2="620" y2="171" stroke="#dee5eb" stroke-width="1" />
    <text x="75" y="162" font-size="16" fill="#16324a" font-weight="400" text-anchor="middle">2</text>
    <text x="190" y="162" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₁ = 40</text>
    <text x="315" y="162" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₂ = 40</text>
    <text x="440" y="162" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₃ = 60</text>
    <text x="561" y="162" font-size="18" fill="#6f1d77" font-weight="700" text-anchor="middle">46⅔</text>
    <rect x="20" y="172" width="600" height="31" fill="#fff" />
    <line x1="20" y1="203" x2="620" y2="203" stroke="#dee5eb" stroke-width="1" />
    <text x="75" y="194" font-size="16" fill="#16324a" font-weight="400" text-anchor="middle">3</text>
    <text x="190" y="194" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₂ = 40</text>
    <text x="315" y="194" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₃ = 60</text>
    <text x="440" y="194" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₄ = 40</text>
    <text x="561" y="194" font-size="18" fill="#6f1d77" font-weight="700" text-anchor="middle">46⅔</text>
    <rect x="20" y="204" width="600" height="31" fill="#f5f7f9" />
    <line x1="20" y1="235" x2="620" y2="235" stroke="#dee5eb" stroke-width="1" />
    <text x="75" y="226" font-size="16" fill="#16324a" font-weight="400" text-anchor="middle">4</text>
    <text x="190" y="226" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₃ = 60</text>
    <text x="315" y="226" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₄ = 40</text>
    <text x="440" y="226" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₅ = 40</text>
    <text x="561" y="226" font-size="18" fill="#6f1d77" font-weight="700" text-anchor="middle">46⅔</text>
    <rect x="20" y="236" width="600" height="31" fill="#fff" />
    <line x1="20" y1="267" x2="620" y2="267" stroke="#dee5eb" stroke-width="1" />
    <text x="75" y="258" font-size="16" fill="#16324a" font-weight="400" text-anchor="middle">5</text>
    <text x="190" y="258" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₄ = 40</text>
    <text x="315" y="258" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₅ = 40</text>
    <text x="440" y="258" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₆ = 40</text>
    <text x="561" y="258" font-size="18" fill="#6f1d77" font-weight="700" text-anchor="middle">40</text>
    <rect x="20" y="268" width="600" height="31" fill="#f5f7f9" />
    <line x1="20" y1="299" x2="620" y2="299" stroke="#dee5eb" stroke-width="1" />
    <text x="75" y="290" font-size="16" fill="#16324a" font-weight="400" text-anchor="middle">6</text>
    <text x="190" y="290" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₅ = 40</text>
    <text x="315" y="290" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">x₆ = 40</text>
    <rect x="399" y="270" width="82" height="26" fill="#fff1e9" stroke="#c87351" rx="4" />
    <text x="440" y="290" font-size="17" fill="#16324a" font-weight="700" text-anchor="middle">x₇ = 0</text>
    <text x="561" y="290" font-size="18" fill="#6f1d77" font-weight="700" text-anchor="middle">26⅔</text>
    <text x="22" y="331" font-size="15" fill="#40566a" font-weight="400" text-anchor="start">At hour 1, (0 + 40 + 40)/3 = 26⅔ cm. The outlined zeros are padding.</text>
  </g>
</svg>
