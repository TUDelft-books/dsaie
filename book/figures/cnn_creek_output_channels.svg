<svg xmlns="http://www.w3.org/2000/svg" width="640" height="348" viewBox="0 0 640 348" role="img" aria-labelledby="title desc">
  <title id="title">One creek record, two output channels</title>
  <desc id="desc">The creek levels, recorded every six hours, are 40, 40, 60, 40, 40 and 40 cm. Both filters use the same three readings at each window centre. At readings 2, 3, 4 and 5 the peak filter (−1, 2, −1) gives −20, 40, −20 and 0 cm. The moving-average filter (⅓, ⅓, ⅓) gives 46⅔, 46⅔, 46⅔ and 40 cm.</desc>
  <rect width="640" height="348" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#16324a">
    <text x="20" y="29" font-size="21" font-weight="700">One creek record, two output channels</text>
    <text x="20" y="56" font-size="16">Input (cm)   40, 40, 60, 40, 40, 40</text>
    <text x="618" y="56" font-size="15" text-anchor="end" fill="#40566a">Valid windows · stride 1 · zero bias</text>

    <g aria-label="Peak scores at readings 2 through 5">
      <text x="20" y="112" font-size="16" font-weight="700">Peak score (cm)</text>
      <text x="20" y="137" font-size="16" fill="#40566a">Weights (−1, 2, −1)</text>
      <rect x="218" y="74" width="402" height="117" rx="4" fill="#eaeaf2"/>
      <path d="M250 74v117 M360 74v117 M470 74v117 M580 74v117" fill="none" stroke="white"/>
      <line x1="218" y1="144" x2="620" y2="144" stroke="#aebbc9"/>
      <text x="211" y="149" text-anchor="end" font-size="13" fill="#40566a">0</text>
      <polyline points="250,168 360,96 470,168 580,144" fill="none" stroke="#6f1d77" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>
      <g fill="white" stroke="#6f1d77" stroke-width="2">
        <rect x="246" y="164" width="8" height="8"/>
        <rect x="356" y="92" width="8" height="8"/>
        <rect x="466" y="164" width="8" height="8"/>
        <rect x="576" y="140" width="8" height="8"/>
      </g>
      <g text-anchor="middle" font-size="16" font-weight="700">
        <text x="250" y="185">−20</text>
        <text x="360" y="88">40</text>
        <text x="470" y="185">−20</text>
        <text x="580" y="135">0</text>
      </g>
    </g>

    <g aria-label="Moving averages at readings 2 through 5">
      <text x="20" y="238" font-size="16" font-weight="700">Moving average (cm)</text>
      <text x="20" y="263" font-size="16" fill="#40566a">Weights (⅓, ⅓, ⅓)</text>
      <rect x="218" y="200" width="402" height="117" rx="4" fill="#eaeaf2"/>
      <path d="M250 200v117 M360 200v117 M470 200v117 M580 200v117" fill="none" stroke="white"/>
      <line x1="218" y1="300" x2="620" y2="300" stroke="#aebbc9"/>
      <text x="211" y="305" text-anchor="end" font-size="13" fill="#40566a">0</text>
      <polyline points="250,244 360,244 470,244 580,252" fill="none" stroke="#0076c2" stroke-width="2.5" stroke-linejoin="round"/>
      <g fill="white" stroke="#0076c2" stroke-width="2">
        <circle cx="250" cy="244" r="4"/>
        <circle cx="360" cy="244" r="4"/>
        <circle cx="470" cy="244" r="4"/>
        <circle cx="580" cy="252" r="4"/>
      </g>
      <g text-anchor="middle" font-size="16" font-weight="700">
        <text x="250" y="234">46⅔</text>
        <text x="360" y="234">46⅔</text>
        <text x="470" y="234">46⅔</text>
        <text x="580" y="242">40</text>
      </g>
    </g>
    <text x="20" y="339" font-size="16" font-weight="700" fill="#40566a">Reading at window centre</text>
    <g text-anchor="middle" font-size="16">
      <text x="250" y="339">2</text>
      <text x="360" y="339">3</text>
      <text x="470" y="339">4</text>
      <text x="580" y="339">5</text>
    </g>
  </g>
</svg>
