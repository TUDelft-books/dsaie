    <rect x="20" y="324" width="4" height="43" fill="#6f1d77" rx="2" />
    <text x="34" y="352" font-size="16" fill="#16324a" font-weight="700" text-anchor="start">Score at reading 2</text>
    <text x="225" y="353" font-size="20" fill="#6f1d77" font-weight="700" text-anchor="start">z₂ = −40 + 2 × 40 − 60 = −20</text>
