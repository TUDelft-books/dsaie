<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="640" height="378" viewBox="0 0 640 378" role="img">
  <title id="title">Peak filter centred at reading 2</title>
  <desc id="desc">The six creek levels, recorded every six hours, are 40, 40, 60, 40, 40 and 40 centimetres. The highlighted window covers readings 1 to 3. Its score at reading 2 is minus 20. Readings 2 through 5 have peak scores of minus 20, 40, minus 20 and 0. Each end of the record lacks a neighbour.</desc>
