  </g>
  <rect x="363" y="205" width="292" height="76" fill="#fff1e9" rx="6" />
  <text x="378" y="231" font-size="15" text-anchor="start" fill="#903d25" font-weight="bold">Southeast district</text>
  <text x="378" y="261" font-size="19" text-anchor="start" fill="#16324a" font-weight="bold">(4 + 6 + 5 + 9) / 4 = 6 mm</text>
</svg>
