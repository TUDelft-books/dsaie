<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" fill="#16324a">
  <title id="title">Mean rainfall pooling by district</title>
  <desc id="desc">The 4 by 4 input in millimetres has rows 0 1 2 1; 0 0 3 2; 5 2 4 6; 1 4 5 9. Each district covers a disjoint 2 by 2 block. The northwest, northeast, southwest and southeast means are 0.25, 2, 3 and 6. The southeast cells sum to 24, giving a mean of 6 millimetres.</desc>
  <rect x="0" y="0" width="680" height="316" fill="#ffffff" />
  <text x="20" y="27" font-size="19" text-anchor="start" fill="#16324a" font-weight="bold">Rainfall (mm)</text>
  <text x="363" y="27" font-size="19" text-anchor="start" fill="#16324a" font-weight="bold">District mean (mm)</text>
  <g id="rainfall-grid">
