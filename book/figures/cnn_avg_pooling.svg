    <text x="219" y="51" font-size="14" text-anchor="middle" fill="#496171">East</text>
    <text x="71" y="111" font-size="14" text-anchor="end" fill="#496171">North</text>
    <text x="71" y="203" font-size="14" text-anchor="end" fill="#496171">South</text>
