<svg xmlns="http://www.w3.org/2000/svg" width="680" height="394" viewBox="0 0 680 394" role="img" aria-labelledby="title desc">
  <title id="title">How kernel size, stride and dilation change a 1D filter</title>
  <desc id="desc">All rows use the same nine input positions. For a window centred at 5, size 3 uses positions 4–6, and size 5 uses 3–7. With width 3 and adjacent taps, valid output centres at stride 1 are 2, 3, 4, 5, 6, 7 and 8; at stride 2 they are 2, 4, 6 and 8. With width 3 centred at 5, dilation 1 samples 4, 5 and 6; dilation 2 samples 3, 5 and 7. Circles mark inputs used in one window, while diamonds mark centres of successive windows.</desc>
