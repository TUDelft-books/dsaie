<svg xmlns="http://www.w3.org/2000/svg" width="640" height="261" viewBox="0 0 640 261" role="img" aria-labelledby="title desc">
  <title id="title">Growth of the receptive field across three layers</title>
  <desc id="desc">Each row shows which original input positions can affect a unit centred at position 5. Layer 1 covers positions 4 to 6, layer 2 covers positions 3 to 7, and layer 3 covers positions 2 to 8. The three intervals contain 3, 5 and 7 input elements.</desc>
  <rect width="640" height="261" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="29" font-size="21" fill="#16324a" font-weight="700" text-anchor="start">Receptive field of the unit centred at position 5</text>
    <text x="20" y="65" font-size="16" fill="#40566a" font-weight="700" text-anchor="start">Input position</text>
    <text x="165" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">1</text>
    <line x1="165" y1="76" x2="165" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="219" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">2</text>
    <line x1="219" y1="76" x2="219" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="273" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">3</text>
    <line x1="273" y1="76" x2="273" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="327" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">4</text>
    <line x1="327" y1="76" x2="327" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="381" y="65" font-size="17" fill="#16324a" font-weight="700" text-anchor="middle">5</text>
    <line x1="381" y1="76" x2="381" y2="210" stroke="#b1bcc7" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="435" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">6</text>
    <line x1="435" y1="76" x2="435" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="489" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">7</text>
    <line x1="489" y1="76" x2="489" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="543" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">8</text>
    <line x1="543" y1="76" x2="543" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="597" y="65" font-size="17" fill="#16324a" font-weight="400" text-anchor="middle">9</text>
    <line x1="597" y1="76" x2="597" y2="210" stroke="#dbe3ea" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="20" y="105" font-size="18" fill="#16324a" font-weight="700" text-anchor="start">Layer 1</text>
    <rect x="310" y="83" width="142" height="32" rx="4" fill="#e3f1fa" stroke="#0076c2" />
    <text x="381" y="105" font-size="17" fill="#16324a" font-weight="700" text-anchor="middle">3 positions</text>
    <line x1="327" y1="111" x2="327" y2="115" stroke="#0076c2" stroke-width="1.8" />
    <line x1="381" y1="111" x2="381" y2="115" stroke="#0076c2" stroke-width="1.8" />
    <line x1="435" y1="111" x2="435" y2="115" stroke="#0076c2" stroke-width="1.8" />
    <text x="20" y="150" font-size="18" fill="#16324a" font-weight="700" text-anchor="start">Layer 2</text>
    <rect x="256" y="128" width="250" height="32" rx="4" fill="#e3f1fa" stroke="#0076c2" />
    <text x="381" y="150" font-size="17" fill="#16324a" font-weight="700" text-anchor="middle">5 positions</text>
    <line x1="273" y1="156" x2="273" y2="160" stroke="#0076c2" stroke-width="1.8" />
    <line x1="327" y1="156" x2="327" y2="160" stroke="#0076c2" stroke-width="1.8" />
    <line x1="381" y1="156" x2="381" y2="160" stroke="#0076c2" stroke-width="1.8" />
    <line x1="435" y1="156" x2="435" y2="160" stroke="#0076c2" stroke-width="1.8" />
    <line x1="489" y1="156" x2="489" y2="160" stroke="#0076c2" stroke-width="1.8" />
    <text x="20" y="195" font-size="18" fill="#16324a" font-weight="700" text-anchor="start">Layer 3</text>
    <rect x="202" y="173" width="358" height="32" rx="4" fill="#e3f1fa" stroke="#0076c2" />
    <text x="381" y="195" font-size="17" fill="#16324a" font-weight="700" text-anchor="middle">7 positions</text>
    <line x1="219" y1="201" x2="219" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="273" y1="201" x2="273" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="327" y1="201" x2="327" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="381" y1="201" x2="381" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="435" y1="201" x2="435" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="489" y1="201" x2="489" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="543" y1="201" x2="543" y2="205" stroke="#0076c2" stroke-width="1.8" />
    <line x1="20" y1="220" x2="620" y2="220" stroke="#ccd5dd" stroke-width="1" />
    <text x="20" y="246" font-size="16" fill="#40566a" font-weight="400" text-anchor="start">Each layer uses width 3, stride 1 and dilation 1.</text>
  </g>
</svg>
